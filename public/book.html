<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จองที่พัก / Book a stay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<style>
  body{background:#fff}
  .wrapx{max-width:1040px;margin:0 auto;padding:0 20px}
  /* search bar (shared ids, styled per template) */
  .searchbar{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);box-shadow:0 16px 40px rgba(15,23,42,.14);padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
  .searchbar .f label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  @media(max-width:720px){.searchbar{grid-template-columns:1fr 1fr}}
  /* generic room card */
  .rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:18px} @media(max-width:820px){.rooms{grid-template-columns:1fr 1fr}} @media(max-width:560px){.rooms{grid-template-columns:1fr}}
  .room{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden;display:flex;flex-direction:column}
  .room .pic{height:160px;background:linear-gradient(135deg,var(--brand),var(--brand2));background-size:cover;background-position:center;position:relative}
  .room .thumbs{position:absolute;left:8px;bottom:8px;display:flex;gap:4px}.room .thumbs div{width:28px;height:22px;border-radius:4px;background-size:cover;background-position:center;cursor:pointer;border:2px solid rgba(255,255,255,.7)}
  .room .body{padding:14px 16px;display:flex;flex-direction:column;flex:1} .room h3{font-size:16px;margin:0 0 3px} .room .cap{color:var(--muted);font-size:12.5px;margin-bottom:8px} .room .desc{color:var(--muted);font-size:13px;line-height:1.5;margin:-2px 0 8px} .amen-chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px} .amen-chips span{background:#f1f5f9;border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink)} #sec-about .amen-chips{justify-content:center;margin-top:14px} #sec-about .amen-chips span{font-size:14px;padding:5px 12px;background:#fff;border:1px solid var(--line)}
  .room .avail{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--amber)} .room .avail.no{color:var(--red)}
  .room .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
  .room .now{font-size:19px;font-weight:800} .room .ota{font-size:12px;color:var(--muted);text-decoration:line-through} .room .save{display:block;color:var(--green);font-size:11px;font-weight:700}
  /* sections */
  .sec{max-width:1040px;margin:0 auto;padding:50px 20px} .sec.alt{max-width:none;background:color-mix(in srgb,var(--brand) 6%,#fff)} .sec.alt .inner{max-width:1040px;margin:0 auto}
  .kick{text-align:center;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--brand);font-weight:800;margin-bottom:6px} .sec h2{text-align:center;font-size:25px;margin:0 0 6px;font-family:var(--font)} .lead{text-align:center;color:var(--muted);max-width:540px;margin:0 auto 26px;font-size:14px}
  .amen{display:grid;grid-template-columns:repeat(4,1fr);gap:14px} @media(max-width:640px){.amen{grid-template-columns:1fr 1fr}}
  .am{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);padding:18px 14px;text-align:center} .am .ic{font-size:26px;margin-bottom:8px;height:60px;border-radius:12px;background:color-mix(in srgb,var(--brand) 12%,#fff);display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center} .am .t{font-weight:700;font-size:14px} .am .d{color:var(--muted);font-size:12.5px;margin-top:3px} .am .p{color:var(--brand);font-weight:800;font-size:13px;margin-top:5px}
  .gal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px} @media(max-width:640px){.gal{grid-template-columns:1fr 1fr}} .gt{height:120px;border-radius:calc(var(--card-radius)*.7);background-size:cover;background-position:center;background-color:var(--line)}
  .benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:860px;margin:0 auto} @media(max-width:640px){.benefits{grid-template-columns:1fr}} .ben{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);padding:20px;text-align:center} .ben .ic{font-size:26px;margin-bottom:8px} .ben .t{font-weight:700;margin-bottom:3px} .ben .d{color:var(--muted);font-size:13px}
  .ctaband{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;text-align:center;padding:50px 20px} .ctaband h2{font-family:var(--font);font-size:25px;margin:0 0 14px} .ctaband .btn{background:#fff;color:var(--brand)}
  .gfoot{background:#0f1622;color:#aeb6c2;text-align:center;padding:26px 20px;font-size:13px} .gfoot a{color:#cdd3dd}
  /* nav + hero (used by several) */
  .gnav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .gnav .in{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
  .gnav .logo{display:flex;align-items:center;gap:9px;font-family:var(--font);font-weight:800;font-size:17px} .gnav .logo .dot{width:28px;height:28px;border-radius:calc(var(--card-radius)*.45);background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center}
  .gnav .menu{display:flex;gap:20px;font-size:13.5px;color:var(--muted)} .gnav .menu a{color:inherit;text-decoration:none;cursor:pointer} @media(max-width:640px){.gnav .menu{display:none}}
  .ghero{position:relative;min-height:360px;display:flex;flex-direction:column;justify-content:center;color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--brand),var(--brand2))}
  .ghero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.42))}
  .ghero .in{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:44px 20px 64px;width:100%}
  .ghero .eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;opacity:.92;margin-bottom:12px} .ghero h1{font-family:var(--font);font-size:clamp(30px,5vw,44px);font-weight:800;margin:0 0 12px;text-shadow:0 2px 24px rgba(0,0,0,.25)} .ghero .tag{font-size:15px;opacity:.95;max-width:540px}
  .overlap{margin-top:-34px;position:relative;z-index:30}
  /* สรุปยอด + ตัวเลือกชำระเงิน (หน้าต่างจอง) */
  .srow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)} .srow>span:last-child{text-align:right}
  .srow.total{border-bottom:none;border-top:2px solid var(--line);margin-top:6px;padding-top:12px;font-size:18px;font-weight:800}
  .pay{display:flex;gap:8px;margin:4px 0 10px}
  .pay .opt{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);background:#fff}
  .pay .opt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,#fff);color:var(--brand)}
  /* อาหารเช้า · ข้อมูลการเข้าพัก · หน้ายืนยันการจอง */
  .bf{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin:0 0 8px;width:fit-content}
  .bf.inc{background:#ecfdf5;color:#047857} .bf.opt{background:#fff7ed;color:#b45309}
  .stay{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;max-width:980px;margin:0 auto}
  .stay .it{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);padding:16px 18px;text-align:left}
  .stay .it .h{font-weight:800;margin-bottom:6px} .stay .it .b{color:var(--muted);font-size:13.5px;line-height:1.6;white-space:pre-line;margin-bottom:8px}
  .stay .it .big{font-size:22px;font-weight:800;margin-bottom:2px} .stay .it .big span{color:var(--muted);font-weight:400}
  .bfrow{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:9px 12px;margin:8px 0;font-size:13px}
  .bfrow label{display:flex;gap:8px;align-items:center;font-weight:600;margin:0;cursor:pointer} .bfrow select{width:auto;padding:4px 8px}
  .holdnote{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;font-size:12.5px;margin:8px 0;line-height:1.5}
  .done-hero{text-align:center;padding:2px 0 6px} .done-hero .ok{width:58px;height:58px;border-radius:50%;background:#ecfdf5;color:#047857;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
  .done-hero h3{margin:0;font-size:20px} .done-hero p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .done-ref{background:#f6f8fb;border:1px dashed var(--line);border-radius:12px;text-align:center;padding:10px;margin:10px 0}
  .done-ref .l{font-size:12px;color:var(--muted)} .done-ref .n{font-size:24px;font-weight:800;letter-spacing:2px}
  .done-acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0} .done-acts .btn{flex:1;justify-content:center;text-align:center;text-decoration:none}
  details.rules{background:#f6f8fb;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13px} details.rules summary{cursor:pointer;font-weight:700} details.rules div{white-space:pre-line;color:var(--muted);margin-top:6px;line-height:1.6}

  /* ========== RICH (default) ========== */
  /* uses base nav/hero/overlap search/rooms grid — no extra needed */

  /* ========== EDITORIAL ========== */
  .tpl-editorial{font-family:var(--font)}
  .tpl-editorial .ed-top{display:flex;justify-content:center;padding:26px;letter-spacing:6px;font-size:13px;color:var(--muted)}
  .tpl-editorial .ghero{min-height:420px} .tpl-editorial .ghero .in{align-self:flex-end}
  .tpl-editorial .searchbar{box-shadow:none;border-radius:0;border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);max-width:800px;margin:30px auto}
  .tpl-editorial .rooms{display:block}
  .tpl-editorial .room{grid-template-columns:none;display:grid;grid-template-columns:1fr 1fr;align-items:center;border:none;border-radius:0;margin-bottom:10px}
  .tpl-editorial .room:nth-child(even) .pic{order:2}
  .tpl-editorial .room .pic{height:300px} .tpl-editorial .room .body{padding:0 50px} .tpl-editorial .room h3{font-size:26px}

  /* ========== MAGAZINE ========== */
  .tpl-magazine .ghero{min-height:auto;background:transparent;color:var(--ink);overflow:visible}
  .tpl-magazine .ghero:after{display:none}
  .tpl-magazine .ghero .in{padding:10px 20px 20px;position:relative}
  .tpl-magazine .blob{position:absolute;width:280px;height:280px;border-radius:50%;background:var(--accent);opacity:.2;top:-60px;right:-40px;z-index:0}
  .tpl-magazine .ghero h1{font-size:72px;letter-spacing:-2px;line-height:.9;color:var(--ink);text-shadow:none;position:relative;z-index:1}
  .tpl-magazine .ghero .eyebrow,.tpl-magazine .ghero .tag{color:var(--muted);position:relative;z-index:1}
  .tpl-magazine .searchbar{box-shadow:none;border:none;background:transparent;display:flex;gap:10px;flex-wrap:wrap;padding:8px 0}
  .tpl-magazine .searchbar .f{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 14px}
  .tpl-magazine #g-rooms{display:block;columns:3;column-gap:16px} @media(max-width:760px){.tpl-magazine #g-rooms{columns:2}} @media(max-width:480px){.tpl-magazine #g-rooms{columns:1}}
  .tpl-magazine .room{break-inside:avoid;margin-bottom:16px;border-width:2px}
  .tpl-magazine .room:nth-child(3n+1) .pic{height:220px}

  /* ========== SPLIT ========== */
  .tpl-split .splitwrap{display:grid;grid-template-columns:360px 1fr;min-height:100vh} @media(max-width:820px){.tpl-split .splitwrap{grid-template-columns:1fr}}
  .tpl-split .sleft{background:linear-gradient(160deg,var(--brand),var(--brand2));color:#fff;padding:30px 24px}
  .tpl-split .sleft .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;margin-bottom:12px}
  .tpl-split .sleft .eyebrow,.tpl-split .sleft .tag{opacity:.92;font-size:14px;margin-bottom:4px}
  .tpl-split .sleft .searchbar{margin:18px 0;grid-template-columns:1fr;color:var(--ink)}
  .tpl-split .sleft .ben{background:rgba(255,255,255,.14);border:none;color:#fff;text-align:left;margin-top:12px}
  .tpl-split .sright{padding:20px} .tpl-split .sright .rooms{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}

  /* ========== SIMPLE ========== */
  .tpl-simple .sim-cover{height:180px;background:linear-gradient(135deg,var(--brand),var(--brand2));background-size:cover;background-position:center}
  .tpl-simple .sim-col{max-width:440px;margin:0 auto;padding:0 18px 40px;text-align:center}
  .tpl-simple .sim-av{width:90px;height:90px;border-radius:50%;background:#fff;border:5px solid #fff;margin:-46px auto 8px;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .tpl-simple h1{font-size:23px;margin:0 0 4px} .tpl-simple .bio{color:var(--muted);font-size:13.5px;margin-bottom:16px}
  .tpl-simple .searchbar{grid-template-columns:1fr 1fr;text-align:left} .tpl-simple .searchbar .go{grid-column:1/-1}
  .tpl-simple .rooms{grid-template-columns:1fr;text-align:left} .tpl-simple .room .pic{height:170px}
  .tpl-simple .lk{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);padding:14px;margin-top:10px;font-weight:700;text-decoration:none;color:var(--ink)}

  /* ========== CATALOG ========== */
  .tpl-catalog .cat-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20}
  .tpl-catalog .cat-bar .logo{font-weight:800;margin-right:auto}
  .tpl-catalog .cat-bar .searchbar{box-shadow:none;border-radius:999px;padding:4px;display:flex;align-items:center;gap:0}
  .tpl-catalog .cat-bar .searchbar .f{padding:6px 12px} .tpl-catalog .cat-bar .searchbar .f label{display:none}
  .tpl-catalog .fil{display:flex;gap:8px;flex-wrap:wrap;max-width:1040px;margin:16px auto 0;padding:0 20px} .tpl-catalog .fil span{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--muted)}
  .tpl-catalog .rooms{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .tpl-catalog .room{border-radius:var(--card-radius)} .tpl-catalog .room .pic{border-radius:var(--card-radius) var(--card-radius) 0 0}

  /* ========== CLASSIC ========== */
  .tpl-classic .cla-nav{display:flex;align-items:center;justify-content:center;gap:22px;padding:18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  .tpl-classic .cla-nav .logo{font-family:var(--font);font-size:20px;font-weight:800;margin:0 12px;letter-spacing:1px}
  .tpl-classic .ghero{background:color-mix(in srgb,var(--brand) 5%,#fff);color:var(--ink);text-align:center;min-height:auto} .tpl-classic .ghero:after{display:none}
  .tpl-classic .ghero .frame{border:1px solid var(--accent);max-width:620px;margin:0 auto;padding:40px 26px}
  .tpl-classic .ghero h1{color:var(--ink);text-shadow:none;font-size:38px} .tpl-classic .ghero .eyebrow{color:var(--accent)} .tpl-classic .ghero .tag{color:var(--muted);margin:0 auto}
  .tpl-classic .hr{color:var(--accent);font-size:22px;margin:8px 0}
  .tpl-classic h2{text-align:center} .tpl-classic .room{text-align:center;border:1px solid var(--accent)} .tpl-classic .room .foot{flex-direction:column;gap:10px;align-items:center}

  /* ========== BENTO ========== */
  .tpl-bento{background:color-mix(in srgb,var(--brand) 5%,#eef1f4);padding:16px}
  .tpl-bento .bento{display:grid;grid-template-columns:repeat(4,1fr);gap:12px} @media(max-width:760px){.tpl-bento .bento{grid-template-columns:repeat(2,1fr)}}
  .tpl-bento .bt{background:#fff;border-radius:18px;padding:16px;overflow:hidden}
  .tpl-bento .bhero{grid-column:span 2;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;flex-direction:column;justify-content:flex-end;min-height:180px}
  .tpl-bento .bhero h1{font-size:26px;font-weight:800;margin:0;color:#fff;text-shadow:none}
  .tpl-bento .bsearch{grid-column:span 2} .tpl-bento .bsearch .searchbar{box-shadow:none;border:none;padding:0;grid-template-columns:1fr 1fr}
  .tpl-bento .brooms{grid-column:1/-1} .tpl-bento .rooms{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))} .tpl-bento .room{border-radius:18px}

  /* ========== FULLSCREEN ========== */
  .tpl-fullscreen .ghero{min-height:480px;justify-content:center;text-align:center} .tpl-fullscreen .ghero .in{text-align:center} .tpl-fullscreen .ghero .tag{margin:0 auto}
  .tpl-fullscreen .fs-nav{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;color:#fff;font-weight:700}
  .tpl-fullscreen .searchbar{border-radius:0;box-shadow:0 6px 20px rgba(15,23,42,.1);position:sticky;top:0;z-index:30;margin:0;max-width:none}

  /* ========== IMMERSIVE ========== */
  .tpl-immersive{color:#fff}
  .tpl-immersive .im-nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:rgba(10,14,20,.5);backdrop-filter:blur(6px);color:#fff;font-weight:700}
  .tpl-immersive .im-sc{height:360px;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
  .tpl-immersive .im-sc:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)} .tpl-immersive .im-cap{position:relative;z-index:2;max-width:560px}
  .tpl-immersive .im-cap .e{letter-spacing:5px;font-size:12px;text-transform:uppercase;opacity:.9;margin-bottom:12px} .tpl-immersive .im-cap h1{font-size:40px;font-weight:700;margin-bottom:12px;text-shadow:0 2px 24px rgba(0,0,0,.4)} .tpl-immersive .im-cap p{opacity:.95}
  .tpl-immersive .im-s1{background:linear-gradient(135deg,var(--brand),var(--brand2))} .tpl-immersive .im-s2{background:linear-gradient(135deg,var(--brand2),var(--accent))}
  .tpl-immersive .im-book{background:#fff;color:var(--ink);padding:40px 20px}
  .tpl-immersive .im-book .searchbar{max-width:900px;margin:0 auto 28px} .tpl-immersive .rooms{max-width:1000px;margin:0 auto}
  .tpl-immersive h2{color:var(--ink)}
</style>
</head>
<body>
<div id="page"></div>

<div id="bkModal" class="modal"><div class="modal-card" style="max-width:440px">
  <div class="modal-head"><h3 id="bk-ttl"></h3><button class="x" onclick="closeBk()">✕</button></div><div id="g-sum"></div>
</div></div>
<div id="actModal" class="modal"><div class="modal-card" style="max-width:420px">
  <div class="modal-head"><h3 id="act-ttl"></h3><button class="x" onclick="closeAct()">✕</button></div><div id="act-body"></div>
</div></div>
<div id="payModal" class="modal"><div class="modal-card" style="max-width:380px">
  <div class="modal-head"><h3 id="pay-ttl"></h3><button class="x" onclick="closePay()">✕</button></div>
  <div style="text-align:center"><div class="srow total" style="border-top:none;margin:0 0 10px;padding-top:0"><span id="pay-amt-l"></span><span id="pay-amt"></span></div>
    <div id="pay-qrbox"><div id="pay-scan" style="font-size:13px;color:var(--muted);margin-bottom:6px"></div><div id="pay-qr" style="display:flex;justify-content:center;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;width:fit-content;margin:0 auto"></div><p class="note" id="pay-name" style="margin-top:8px"></p></div>
    <div id="pay-noqr" class="note" style="display:none;text-align:left;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px;border-radius:10px"></div>
    <div class="field" style="text-align:left;margin-top:12px"><label id="pay-ref-l"></label><input id="pay-ref"></div>
    <button class="btn block lg" id="pay-done" onclick="reportPaid()"></button><p class="note" id="pay-note"></p></div>
</div></div>
<div id="reviewModal" class="modal"><div class="modal-card" style="max-width:380px">
  <div class="modal-head"><h3 id="rv-ttl"></h3><button class="x" onclick="closeReview()">✕</button></div>
  <p class="sub" id="rv-sub" style="margin-top:0"></p>
  <div class="field"><label id="rv-ref-l"></label><input id="rv-ref" placeholder="BP-XXXXXX"></div>
  <div class="field"><label id="rv-tel-l"></label><input id="rv-tel" placeholder="08x-xxx-xxxx"></div>

<script src="api.js"></script>
<script>
const slug = new URLSearchParams(location.search).get("h");
let HOTEL=null, AVAIL=[], SVC=[], ACT=[], actSel=null, PAY_MODE="room", sel=null, gN=0, gRooms=1, gEB=0, gPay="promptpay", gNotify="email", gDiscount=0, gPromoCode="";
const esc=API.esc, money=API.money, T=API.t;
// กันลิงก์รูปแปลก ๆ หลุดออกจาก url('...') (ป้องกัน XSS)
function cu(u){ return String(u||"").replace(/["'()\\<>\s]/g, c=>"%"+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,"0")); }
function paxNum(){ return parseInt((document.getElementById("g-pax")||{}).value,10)||2; }
function uNight(n){ return n+" "+T("คืน", n>1?"nights":"night"); }
function uRoom(n){ return n+" "+T("ห้อง", n>1?"rooms":"room"); }
function uPax(n){ return n+" "+T("คน", n>1?"guests":"guest"); }
function paxOpts(){ let o=""; for(let i=1;i<=6;i++) o+='<option value="'+i+'"'+(i===2?' selected':'')+'>'+uPax(i)+'</option>'; return o; }
function lineUrl(id){ const s=String(id||"").trim(); if(!/^@?[\w.-]{2,40}$/.test(s)) return ""; return s[0]==="@"?"https://line.me/R/ti/p/"+encodeURIComponent(s):"https://line.me/ti/p/~"+encodeURIComponent(s); }
const TH_D=["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."], TH_M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function dayTxt(ymd){ const d=new Date(ymd+"T00:00:00Z"); if(isNaN(d)) return ymd||""; return API.lang()==="en"?d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}):TH_D[d.getUTCDay()]+" "+d.getUTCDate()+" "+TH_M[d.getUTCMonth()]+" "+(d.getUTCFullYear()+543); }
function whenTxt(iso){ const d=new Date(iso); if(isNaN(d)) return ""; return d.toLocaleString(API.lang()==="en"?"en-GB":"th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Bangkok"}); }
function bfBadge(r){ return r.breakfast==="included"?'<span class="bf inc">🍳 '+T("รวมอาหารเช้า","Breakfast included")+'</span>':r.breakfast==="optional"?'<span class="bf opt">🍳 '+T("เพิ่มอาหารเช้าได้ "+money(r.breakfastPrice)+"/ท่าน","Breakfast "+money(r.breakfastPrice)+"/person")+'</span>':''; }
function scrollToSearch(){ const e=document.querySelector(".searchbar"); if(e) e.scrollIntoView({behavior:"smooth",block:"center"}); }
function scrollToId(id){ const e=document.getElementById(id); if(e) e.scrollIntoView({behavior:"smooth"}); }

// shared fragments
function fSearchFields(){ return '<div class="f"><label>'+T("เช็คอิน","Check-in")+'</label><input id="g-din" type="date" onchange="gSearch()"></div>'+
  '<div class="f"><label>'+T("เช็คเอาท์","Check-out")+'</label><input id="g-dout" type="date" onchange="gSearch()"></div>'+
  '<div class="f"><label>'+T("ผู้เข้าพัก","Guests")+'</label><select id="g-pax" onchange="gSearch()">'+paxOpts()+'</select></div>'; }
function fSearchBtn(){ return '<button class="btn go" onclick="gSearch()">'+T("ค้นหาห้องว่าง","Search")+'</button>'; }
function fSearch(){ return '<div class="searchbar">'+fSearchFields()+fSearchBtn()+'</div>'; }
function fRoomsSec(){ return '<div class="sec" id="sec-rooms"><div class="kick">rooms &amp; rates</div><h2>'+T("ห้องพักของเรา","Our rooms")+'</h2><p class="lead" id="g-note2"></p><div class="rooms" id="g-rooms"></div></div>'; }
function fRoomsPlain(){ return '<p class="lead" id="g-note2" style="margin:10px 0"></p><div class="rooms" id="g-rooms"></div>'; }
function fExtras(){ return '<div class="sec alt" id="sec-amen" style="display:none"><div class="inner"><div class="kick">experience</div><h2>'+T("บริการเสริม","Services")+'</h2><p class="lead"></p><div class="amen" id="g-amen"></div></div></div>'+
  '<div class="sec" id="sec-gal" style="display:none"><div class="kick">gallery</div><h2>'+T("บรรยากาศที่พัก","Our space")+'</h2><p class="lead"></p><div class="gal" id="g-gal"></div></div>'+
  '<div class="sec" id="sec-reviews" style="display:none"><div class="kick">reviews</div><h2>'+T("รีวิวจากผู้เข้าพัก","Guest reviews")+'</h2><p class="lead"></p><div class="benefits" id="g-reviews"></div><div style="text-align:center;margin-top:16px"><button class="btn ghost" onclick="openReview()">'+T("เขียนรีวิว","Write a review")+'</button></div></div>'+
  '<div class="sec"><div class="kick">why book direct</div><h2>'+T("ทำไมจองตรงกับเรา","Why book direct")+'</h2><p class="lead"></p><div class="benefits" id="g-benefits"></div></div>'+
  '<div class="ctaband"><h2>'+T("พร้อมพักผ่อนแล้วหรือยัง?","Ready for a getaway?")+'</h2><button class="btn lg" onclick="scrollToSearch()">'+T("จองที่พัก →","Book now →")+'</button></div>'; }
function fFoot(){ return '<div class="sec" id="sec-act" style="display:none"><div class="kick">experiences</div><h2>'+T("กิจกรรม & ประสบการณ์","Activities & experiences")+'</h2><p class="lead">'+T("จองได้เลย แม้ไม่ได้เข้าพัก","Book even if you are not staying")+'</p><div class="rooms" id="g-acts"></div></div>'+'<div class="sec" id="sec-about" style="display:none"><div class="kick">about</div><h2>'+T("เกี่ยวกับที่พัก","About us")+'</h2><p class="lead" id="g-about" style="white-space:pre-line;max-width:720px;margin-left:auto;margin-right:auto"></p><div class="amen-chips" id="g-hamen"></div></div>'+
  '<div class="sec" id="sec-stay" style="display:none"><div class="kick">good to know</div><h2>'+T("ข้อมูลการเข้าพัก","Good to know")+'</h2><p class="lead"></p><div class="stay" id="g-stay"></div></div><div class="gfoot" id="footer"></div>'; }
function fNav(){ return '<div class="gnav"><div class="in"><div class="logo"><span class="dot">B</span><span id="g-name"></span></div><div class="menu"><a onclick="scrollToId(\'sec-rooms\')">'+T("ห้องพัก","Rooms")+'</a><a onclick="scrollToId(\'sec-amen\')">'+T("บริการ","Services")+'</a></div><button class="btn sm" onclick="scrollToSearch()">'+T("จองเลย","Book")+'</button></div></div>'; }
function fHero(){ return '<div class="ghero" id="ghero"><div class="in"><div class="eyebrow" id="g-eyebrow"></div><h1 id="g-h1"></h1><div class="tag" id="g-tag"></div></div></div>'; }

// 10 templates
const TPL={
 rich:()=> fNav()+fHero()+'<div class="wrapx overlap">'+fSearch()+'</div>'+fRoomsSec()+fExtras()+fFoot(),
 editorial:()=> '<div class="ed-top"><span id="g-name"></span></div>'+fHero()+'<div class="wrapx">'+fSearch()+'</div><div class="sec">'+fRoomsPlain()+'</div>'+fFoot(),
 magazine:()=> fNav()+fHero()+'<div class="wrapx">'+fSearch()+'</div><div class="sec">'+fRoomsPlain()+'</div>'+fFoot(),
 split:()=> '<div class="splitwrap"><div class="sleft"><div class="logo"><span class="dot" style="width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center">B</span><span id="g-name"></span></div><div class="eyebrow" id="g-eyebrow"></div><div class="tag" id="g-tag"></div>'+fSearch()+'<div class="benefits" id="g-benefits" style="display:block"></div></div><div class="sright">'+fRoomsPlain()+'</div></div>'+fFoot(),
 simple:()=> '<div class="sim-cover" id="ghero"></div><div class="sim-col"><div class="sim-av">🏡</div><h1 id="g-name"></h1><div class="bio"><span id="g-eyebrow"></span> <span id="g-tag"></span></div>'+fSearch()+fRoomsPlain()+'<a class="lk" href="privacy.html" target="_blank">📄 '+T("นโยบายความเป็นส่วนตัว","Privacy policy")+'</a></div>'+fFoot(),
 catalog:()=> '<div class="cat-bar"><span class="logo" id="g-name"></span>'+fSearch()+'</div><div class="fil"><span>'+T("ทั้งหมด","All")+'</span><span>'+T("ราคาต่ำ-สูง","Price")+'</span><span>'+T("ว่างวันนี้","Available")+'</span></div><div class="sec">'+fRoomsPlain()+'</div>'+fExtras()+fFoot(),
 classic:()=> '<div class="cla-nav"><span>'+T("ห้องพัก","Rooms")+'</span><span class="logo" id="g-name"></span><span>'+T("ติดต่อ","Contact")+'</span></div><div class="ghero" id="ghero"><div class="in" style="padding:0"><div class="frame"><div class="eyebrow" id="g-eyebrow"></div><h1 id="g-h1"></h1><div class="hr">❧</div><div class="tag" id="g-tag"></div></div></div></div><div class="wrapx" style="margin-top:20px">'+fSearch()+'</div>'+fRoomsSec()+fExtras()+fFoot(),
 bento:()=> '<div class="tpl-bento-wrap"><div class="bento"><div class="bt bhero"><div class="eyebrow" id="g-eyebrow" style="opacity:.9"></div><h1 id="g-h1"></h1><div class="tag" id="g-tag" style="opacity:.9"></div></div><div class="bt bsearch">'+fSearch()+'</div><div class="bt brooms">'+fRoomsPlain()+'</div></div></div>'+fExtras()+fFoot(),
 fullscreen:()=> '<div class="ghero" id="ghero"><div class="fs-nav"><b id="g-name"></b><span>'+T("จองเลย","Book")+'</span></div><div class="in"><div class="eyebrow" id="g-eyebrow"></div><h1 id="g-h1"></h1><div class="tag" id="g-tag"></div></div></div>'+fSearch()+'<div class="sec">'+fRoomsPlain()+'</div>'+fExtras()+fFoot(),
 immersive:()=> '<div class="im-nav"><b id="g-name"></b><span>'+T("จองเลย","Book")+'</span></div><div class="im-sc im-s1" id="ghero"><div class="im-cap"><div class="e" id="g-eyebrow"></div><h1 id="g-h1"></h1><div id="g-tag"></div></div></div><div class="im-sc im-s2"><div class="im-cap"><div class="e">'+T("บทที่สอง","chapter two")+'</div><h1>'+T("พักผ่อนอย่างแท้จริง","Truly unwind")+'</h1></div></div><div class="im-book"><h2 style="text-align:center">'+T("เลือกห้องพัก","Choose a room")+'</h2>'+fSearch()+fRoomsPlain()+'</div>'+fFoot(),
};

async function boot(){
  const page=document.getElementById("page"); API.mountLangToggle();
  if(!slug){ page.innerHTML='<div class="sec"><p class="empty">'+T("ลิงก์ไม่ถูกต้อง (ขาด ?h=ชื่อโรงแรม)","Invalid link (missing ?h=slug)")+'</p></div>'; return; }
  try { HOTEL=await API.pubHotel(slug); } catch { page.innerHTML='<div class="sec"><p class="empty">'+T("ไม่พบโรงแรมนี้","Property not found")+'</p></div>'; return; }
  // ดูตัวอย่างเทมเพลต/ชุดสีก่อนเลือก (จากปุ่ม "ดูตัวอย่าง" ใน LINE) — ยังไม่บันทึก
  const qs=new URLSearchParams(location.search), pvT=qs.get("tpl"), pvP=qs.get("preset"); let preview=false;
  if(pvP){ const p=(API.STYLE_PRESETS||[]).find(x=>x.key===pvP); if(p){ ["brandColor","brandColor2","accentColor","accentColor2","fontFamily","uiStyle"].forEach(k=>{ HOTEL[k]=p[k]; }); preview=true; } }
  if(pvT && TPL[pvT]){ HOTEL.template=pvT; preview=true; }
  API.applyTheme(HOTEL); document.title=T("จองที่พัก","Book a stay")+" · "+HOTEL.name;
  if(HOTEL.approved===false){ page.innerHTML='<div class="sec"><div class="panel" style="text-align:center;max-width:520px;margin:30px auto"><h2>'+T("ยังไม่เปิดรับจอง","Not open yet")+'</h2><p class="sub">'+T("ที่พักนี้กำลังรอการอนุมัติจากทีมงาน BARN-PARK","Awaiting approval from the BARN-PARK team.")+'</p></div></div>'; return; }
  const tpl=(TPL[HOTEL.template]?HOTEL.template:"rich");
  page.className="tpl-"+tpl; page.innerHTML=TPL[tpl]();
  // header
  const setTxt=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  setTxt("g-name",HOTEL.name); setTxt("g-h1",HOTEL.name);
  setTxt("g-eyebrow",(HOTEL.location?("📍 "+HOTEL.location):"")); setTxt("g-tag",HOTEL.tagline||"");
  if(HOTEL.about){ const ab=document.getElementById("g-about"); if(ab){ ab.textContent=HOTEL.about; document.getElementById("sec-about").style.display="block"; } }
  if(HOTEL.amenities&&HOTEL.amenities.length){ const ha=document.getElementById("g-hamen"); if(ha){ ha.innerHTML=HOTEL.amenities.map(a=>'<span>'+esc(a)+'</span>').join(''); document.getElementById("sec-about").style.display="block"; } }
  if(preview){ const pb=document.createElement("div"); pb.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9998;background:#0f2540;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:8px 12px"; pb.textContent=T("👀 ตัวอย่าง (ยังไม่บันทึก) — ถ้าชอบ กลับไปกด “ใช้แบบนี้” ในแชท LINE","👀 Preview only — not saved yet"); document.body.appendChild(pb); }
  const gh=document.getElementById("ghero"); if(gh && HOTEL.coverUrl && tpl!=="magazine" && tpl!=="classic"){ gh.style.background="linear-gradient(135deg,var(--brand),var(--brand2)), url('"+cu(HOTEL.coverUrl)+"') center/cover"; gh.style.backgroundBlendMode="multiply"; }
  renderBenefits(); renderStay();
  const foot=document.getElementById("footer"); if(foot) foot.innerHTML=esc(HOTEL.name)+(HOTEL.phone?(" · "+T("โทร","Tel")+" "+esc(HOTEL.phone)):"")+(HOTEL.lineId?(" · LINE "+esc(HOTEL.lineId)):"")+" · "+T("ขับเคลื่อนโดย","Powered by")+" BARN-PARK · "+(HOTEL.allowGuestCancel!==false?'<a href="#" onclick="openCancel();return false">'+T("ยกเลิกการจอง","Cancel")+'</a> · ':'')+'<a href="privacy.html" target="_blank">'+T("นโยบาย","Privacy")+'</a>';
  setModalText();
  try{ SVC=await API.pubServices(slug); }catch{ SVC=[]; }
  ACT=SVC.filter(s=>s.saleMode==="standalone"||s.saleMode==="both"); SVC=SVC.filter(s=>(s.saleMode||"addon")!=="standalone");
  renderAmen(); renderActs();
  renderReviews();
  const t=new Date(); document.getElementById("g-din").value=API.ymd(API.addDays(t,1)); document.getElementById("g-dout").value=API.ymd(API.addDays(t,3));
  gSearch();
}
function renderBenefits(){ const b=document.getElementById("g-benefits"); if(!b) return; const cd=(HOTEL.cancelDays==null?3:HOTEL.cancelDays);
  b.innerHTML='<div class="ben"><div class="ic">💚</div><div class="t">'+T("ราคาดีที่สุด","Best price")+'</div><div class="d">'+T("จองตรงไม่ผ่านคนกลาง","Direct, no middleman")+'</div></div>'+
    (HOTEL.allowGuestCancel!==false?'<div class="ben"><div class="ic">🗓️</div><div class="t">'+T("ยกเลิกฟรี","Free cancel")+'</div><div class="d">'+T("ก่อนเช็คอิน "+cd+" วัน","Up to "+cd+" days before")+'</div></div>':'<div class="ben"><div class="ic">✅</div><div class="t">'+T("ยืนยันทันที","Instant")+'</div><div class="d">'+T("รู้ผลทันที","Know right away")+'</div></div>')+
    '<div class="ben"><div class="ic">💬</div><div class="t">'+T("คุยกับที่พักตรง ๆ","Talk to host")+'</div><div class="d">'+T("สอบถามก่อนเข้าพัก","Ask before you stay")+'</div></div>';
}
function renderAmen(){ const sec=document.getElementById("sec-amen"); if(!sec) return; if(!SVC.length){ sec.style.display="none"; return; } sec.style.display="block";
  document.getElementById("g-amen").innerHTML=SVC.map(s=>'<div class="am"><div class="ic" style="'+(s.imageUrl?"background-image:url('"+cu(s.imageUrl)+"')":"")+'">'+(s.imageUrl?"":"🛎️")+'</div><div class="t">'+esc(s.name)+'</div>'+(s.description?'<div class="d">'+esc(s.description)+'</div>':'')+(s.price!=null?'<div class="p">'+money(s.price)+'</div>':'')+'</div>').join(""); }
function renderGallery(){ const sec=document.getElementById("sec-gal"); if(!sec) return; const imgs=[]; AVAIL.forEach(r=>{ (r.images||[]).forEach(u=>{ if(u&&imgs.length<8) imgs.push(u); }); if(r.imageUrl&&!(r.images&&r.images.length)&&imgs.length<8) imgs.push(r.imageUrl); });
  if(!imgs.length){ sec.style.display="none"; return; } sec.style.display="block"; document.getElementById("g-gal").innerHTML=imgs.slice(0,8).map(u=>'<div class="gt" style="background-image:url(\''+cu(u)+'\')"></div>').join(""); }
async function gSearch(){
  const din=document.getElementById("g-din").value, dout=document.getElementById("g-dout").value; gN=API.nights(din,dout);
  const note=document.getElementById("g-note2");
  if(gN<1){ if(note)note.textContent=T("กรุณาเลือกวันเช็คเอาท์ให้หลังเช็คอิน","Pick a check-out after check-in"); return; }
  if(note)note.textContent=uNight(gN)+" · "+uPax(paxNum());
  document.getElementById("g-rooms").innerHTML='<p class="empty" style="grid-column:1/-1">'+T("กำลังตรวจห้องว่าง…","Checking availability…")+'</p>';
  try { AVAIL=await API.pubAvailability(slug,din,dout); } catch(e){ document.getElementById("g-rooms").innerHTML='<p class="empty" style="grid-column:1/-1">'+T("โหลดห้องไม่สำเร็จ","Couldn't load rooms")+'</p>'; return; }
  renderRooms(); renderGallery();
}
function renderRooms(){
  if(!AVAIL.length){ document.getElementById("g-rooms").innerHTML='<p class="empty" style="grid-column:1/-1">'+T("โรงแรมนี้ยังไม่ได้ตั้งค่าห้องพัก","No rooms set up yet")+'</p>'; return; }
  document.getElementById("g-rooms").innerHTML=AVAIL.map(r=>{const sold=r.available<=0;const save=(r.otaPrice||0)-(r.basePrice||0);
    const imgs=(r.images&&r.images.length)?r.images:(r.imageUrl?[r.imageUrl]:[]);const pid="rpic-"+r.roomTypeId;
    const pic=imgs.length?"background-image:url('"+cu(imgs[0])+"')":"";
    const thumbs=imgs.length>1?'<div class="thumbs">'+imgs.map((u,i)=>'<div onclick="setRoomPic(\''+pid+'\',\''+i+'\',\''+r.roomTypeId+'\')" style="background-image:url(\''+cu(u)+'\');border-color:'+(i===0?'#fff':'rgba(255,255,255,.4)')+'" data-i="'+i+'"></div>').join('')+'</div>':'';
    return '<div class="room"><div class="pic" id="'+pid+'" style="'+pic+'">'+thumbs+'</div><div class="body"><h3>'+esc(r.name)+'</h3><div class="cap">'+T("รับ "+r.capacity+" คน/ห้อง","Up to "+r.capacity+" guests")+'</div>'+bfBadge(r)+(r.description?'<div class="desc">'+esc(r.description)+'</div>':'')+((r.amenities&&r.amenities.length)?'<div class="amen-chips">'+r.amenities.map(a=>'<span>'+esc(a)+'</span>').join('')+'</div>':'')+
      (sold?'<div class="avail no">'+T("เต็มช่วงนี้","Sold out")+'</div>':'<div class="avail">'+T("ว่าง "+r.available+" ห้อง",r.available+" left")+'</div>')+
      '<div class="foot"><div>'+(save>0?'<span class="ota">'+money(r.otaPrice)+'</span> ':'')+'<span class="now">'+money(r.basePrice)+'</span> <span style="font-size:12px;color:var(--muted)">'+T("/คืน","/night")+'</span>'+(save>0?'<span class="save">'+T("ประหยัด "+money(save),"Save "+money(save))+'</span>':'')+'</div>'+
      (sold?'<button class="btn" disabled>'+T("เต็ม","Full")+'</button>':'<button class="btn" onclick="pick(\''+r.roomTypeId+'\')">'+T("เลือก","Select")+'</button>')+'</div></div></div>';}).join("");
}
function setRoomPic(pid,i,rtId){ const r=AVAIL.find(x=>x.roomTypeId===rtId); if(!r)return; const imgs=(r.images&&r.images.length)?r.images:(r.imageUrl?[r.imageUrl]:[]); const idx=+i;
  const el=document.getElementById(pid); if(el&&imgs[idx]) el.style.backgroundImage="url('"+cu(imgs[idx])+"')";

function pick(id){ sel=AVAIL.find(r=>r.roomTypeId===id); const pax=paxNum(); const av=Math.max(1,sel.available); gRooms=Math.min(Math.max(1,Math.ceil(pax/sel.capacity)),av); gEB=0; gDiscount=0; gPromoCode="";

async function applyPromo(){
  const code=(document.getElementById("g-promo-in").value||"").trim(); const msg=document.getElementById("g-promo-msg");
  if(!code){ gDiscount=0;gPromoCode="";msg.textContent="";recalc();return; }
  const q=+(document.getElementById("g-qty")||{}).value||1; const ebEl=document.getElementById("g-eb"); const eb=ebEl?+ebEl.value:0;
  const subtotal=(Number(sel.basePrice)+eb*Number(sel.extraBedPrice||0))*gN*q;
  try{ const r=await API.pubPromo({ slug, code, nights:gN, subtotal }); gDiscount=r.discount; gPromoCode=code; msg.style.color="var(--green)"; msg.textContent="✔ "+r.label; recalc(); }
  catch(e){ gDiscount=0;gPromoCode=""; msg.style.color="var(--red)"; msg.textContent="✗ "+e.message; recalc(); }
}

function addonSum(){ let t=0; document.querySelectorAll(".g-addon").forEach(s=>{ t+=(+s.dataset.price||0)*(+s.value||0); }); return t; }
function collectAddons(){ const a=[]; document.querySelectorAll(".g-addon").forEach(s=>{ const q=+s.value||0; if(q>0) a.push({ name:s.dataset.name, qty:q }); }); return a; }
function bfOpts(pax,cap){ let o=""; const mx=Math.max(1,Math.min(20,(sel.available||1)*(cap+2))); for(let i=1;i<=mx;i++) o+='<option value="'+i+'"'+(i===Math.min(pax,mx)?' selected':'')+'>'+uPax(i)+'</option>'; return o; }
// ยอดอาหารเช้า — คิดแบบเดียวกับเซิร์ฟเวอร์ (จำนวนท่านไม่เกิน ห้อง × (คนต่อห้อง + เตียงเสริม))
function bfCalc(q,eb){ if(!sel||sel.breakfast!=="optional") return {pax:0,total:0}; const c=document.getElementById("g-bf"); if(!c||!c.checked) return {pax:0,total:0};
  const mx=q*(Math.max(1,sel.capacity||2)+eb), p=Math.max(1,Math.min(mx,+(document.getElementById("g-bfpax")||{}).value||1)); return {pax:p,total:p*Number(sel.breakfastPrice||0)*gN}; }
function totals(){ const q=+(document.getElementById("g-qty")||{}).value||1; const ebEl=document.getElementById("g-eb"); const eb=ebEl?+ebEl.value:0;
  const ebP=Number(sel.extraBedPrice||0), per=(Number(sel.basePrice)+eb*ebP)*gN, subtotal=per*q, addon=addonSum(), bf=bfCalc(q,eb);
  return { q, eb, ebP, per, subtotal, addon, bf, total:Math.max(0,subtotal-gDiscount)+addon+bf.total }; }
function recalc(){ if(!sel)return; const tt0=totals(); const q=tt0.q, eb=tt0.eb; gRooms=q; gEB=eb;
  const ebP=tt0.ebP, addon=tt0.addon, total=tt0.total;
  const br=document.getElementById("g-bf-row"); if(br){ if(tt0.bf.total>0){ br.style.display="flex"; document.getElementById("g-bf-sum").textContent="+"+money(tt0.bf.total)+" ("+uPax(tt0.bf.pax)+" × "+uNight(gN)+")"; } else br.style.display="none"; }
  const l=document.getElementById("g-line"); if(l)l.textContent=money(sel.basePrice)+(eb>0?(" + "+T("เตียง","bed")+" "+money(eb*ebP)):"")+" × "+uNight(gN)+" × "+uRoom(q);
  const dr=document.getElementById("g-disc-row"); if(dr){ if(gDiscount>0){ dr.style.display="flex"; document.getElementById("g-disc").textContent="-"+money(gDiscount); } else dr.style.display="none"; }
  const ar=document.getElementById("g-addon-row"); if(ar){ if(addon>0){ ar.style.display="flex"; document.getElementById("g-addon-sum").textContent="+"+money(addon); } else ar.style.display="none"; }
  const tt=document.getElementById("g-total"); if(tt)tt.textContent=money(total);
  const bt=document.getElementById("g-confirm"); if(bt)bt.textContent=T("ยืนยันการจอง","Confirm booking")+" · "+money(total); }
function setN(el){ document.querySelectorAll("#g-npay .opt").forEach(o=>o.classList.remove("on")); el.classList.add("on"); gNotify=el.dataset.n; }
function setP(el){ el.parentElement.querySelectorAll(".opt").forEach(o=>o.classList.remove("on")); el.classList.add("on"); gPay=el.dataset.p;
  const hn=document.getElementById("g-holdnote"); if(!hn) return; hn.style.display=gPay==="hotel"?"block":"none"; if(gPay!=="hotel") return;
  // ระบบยกเลิกเองเฉพาะเมื่อครบเวลาก่อนวันเช็คอิน (เหมือนฝั่งเซิร์ฟเวอร์)
  const dl=new Date(Date.now()+Number(HOTEL.holdHours||0)*3600e3+7*3600e3).toISOString().slice(0,10), din=(document.getElementById("g-din")||{}).value||"";
  hn.textContent=(HOTEL.holdHours>0&&dl<din)?"⏱ "+T("ที่พักจะเก็บห้องไว้ให้ "+HOTEL.holdHours+" ชม. — กรุณาชำระ (สแกน QR ได้ในหน้าถัดไป) หรือติดต่อที่พักภายในเวลานี้ ไม่เช่นนั้นการจองจะถูกยกเลิกอัตโนมัติ","The room is held for "+HOTEL.holdHours+"h — please pay (QR on the next screen) or contact the property within this time, otherwise the booking is cancelled automatically")
    :"💵 "+T("ชำระที่ที่พักตอนเช็คอิน หรือสแกน QR โอนก่อนเข้าพักได้ในหน้าถัดไป","Pay at check-in, or scan the QR on the next screen to pay before arrival"); }
function ppFmt(id){ const d=String(id||"").replace(/\D/g,""); return d.length===10?d.replace(/(\d{3})(\d{3})(\d{4})/,"$1-$2-$3"):d.length===13?d.replace(/(\d)(\d{4})(\d{5})(\d{2})(\d)/,"$1-$2-$3-$4-$5"):d; }
function copyPP(){ const d=String(HOTEL.promptpayId||"").replace(/\D/g,""); if(navigator.clipboard) navigator.clipboard.writeText(d).then(()=>API.toast(T("คัดลอกเลขพร้อมเพย์แล้ว","PromptPay number copied"),"ok")); }
function ppQrFail(){ document.getElementById("pay-qr").innerHTML='<div class="note" style="margin:0;padding:18px 10px">'+T("โหลด QR ไม่สำเร็จ — โอนเข้าพร้อมเพย์ตามเลขด้านล่างได้เลย","QR failed to load — transfer to the PromptPay number below")+'</div>'; }

function reportPaid(){ const ref=(document.getElementById("pay-ref").value||"").trim(); if(PAY_MODE==="act") submitAct(true, ref); else submitBooking(true, ref); }
async function submitBooking(paid, payRef){ const name=(document.getElementById("g-gname")||{}).value||"", tel=(document.getElementById("g-tel")||{}).value||"";
  const btns=[document.getElementById("g-confirm"),document.getElementById("pay-done")].filter(Boolean); btns.forEach(b=>{b.disabled=true;});
  const tt=totals(), email=(document.getElementById("g-mail").value||"").trim();
  try { const res=await API.pubBook({ slug, roomTypeId:sel.roomTypeId, din:document.getElementById("g-din").value, dout:document.getElementById("g-dout").value, name:name.trim(), tel:tel.trim(), email, pax:paxNum(), notify:gNotify, rooms:gRooms, extraBed:gEB, paid, payRef, promoCode:gPromoCode, addons:collectAddons(), breakfast:tt.bf.pax>0, breakfastPax:tt.bf.pax, note:((document.getElementById("g-note")||{}).value||"").trim() });

  }catch{} actRecalc(); }
function actRecalc(){ if(!actSel) return; const ts=document.getElementById("a-time"); let left=actLeft;
  if(ts){ const o=ts.options[ts.selectedIndex]; left=(o&&o.dataset.left!=="")?+o.dataset.left:null; if(!ts.options.length||(o&&o.disabled)) left=0; }
  const q=+document.getElementById("a-qty").value||1; const el=document.getElementById("a-left");
  el.textContent=left==null?"":(left<=0?T("วัน/รอบนี้เต็มแล้ว","Fully booked"):T("ว่างอีก "+left+" ท่าน",left+" spots left"));
  el.style.color=(left!=null&&q>left)?"var(--red)":"var(--muted)";
  document.getElementById("a-total").textContent=money((actSel.price||0)*q); }
function actTotal(){ return (actSel.price||0)*(+document.getElementById("a-qty").value||1); }
function confirmAct(pay){ const n=document.getElementById("a-name").value.trim(), t=document.getElementById("a-tel").value.trim();
  if(!n){ API.toast(T("กรุณากรอกชื่อ","Enter your name"),"err"); return; } if(!t){ API.toast(T("กรุณากรอกเบอร์","Enter your phone"),"err"); return; }
  if(!document.getElementById("a-consent").checked){ API.toast(T("กรุณายินยอมนโยบายความเป็นส่วนตัวก่อนจอง","Please accept the privacy policy"),"err"); return; }
  if(pay && actTotal()>0){ PAY_MODE="act"; openPay(actTotal()); return; } submitAct(false,""); }
async function submitAct(paid, payRef){ const btns=["a-pay","a-later","pay-done"].map(i=>document.getElementById(i)).filter(Boolean); btns.forEach(b=>b.disabled=true);
  try{ const ts=document.getElementById("a-time");
    const r=await fetch("/api/public/book-activity",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ slug, serviceId:actSel._id, date:document.getElementById("a-date").value, time:ts?ts.value:"", qty:+document.getElementById("a-qty").value||1, name:document.getElementById("a-name").value.trim(), tel:document.getElementById("a-tel").value.trim(), email:document.getElementById("a-mail").value.trim(), paid, payRef })});
    const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||"error");
    closePay(); closeAct(); showDone("act",Object.assign({},d,{serviceName:actSel.name,tel:document.getElementById("a-tel").value.trim(),email:document.getElementById("a-mail").value.trim(),payStatus:paid?"reported":"unpaid"}));
  }catch(e){ API.toast(T("จองไม่สำเร็จ: ","Booking failed: ")+e.message,"err"); }
  btns.forEach(b=>b.disabled=false); }
// ===== หน้ายืนยันการจอง (แคปเก็บไว้ได้) =====
let DONE=null;
function closeDone(){ document.getElementById("doneModal").classList.remove("on"); }
function copyRef(){ if(DONE&&navigator.clipboard) navigator.clipboard.writeText(DONE.ref).then(()=>API.toast(T("คัดลอกเลขจองแล้ว","Booking no. copied"),"ok")); }
function showDone(kind,d){ DONE=Object.assign({kind},d); const H=HOTEL, rep=d.payStatus==="reported", unpaid=d.payStatus==="unpaid";
  const row=(k,v)=>v?'<div class="srow"><span style="color:var(--muted)">'+k+'</span><span style="text-align:right">'+v+'</span></div>':"";
  let rows="";
  if(kind==="room"){
    rows=row(T("ห้อง","Room"),esc(d.roomName)+(d.rooms>1?" × "+uRoom(d.rooms):""))+
      row(T("เช็คอิน","Check-in"),dayTxt(d.checkin)+(H.checkInTime?"<br><small>"+T("ตั้งแต่ "+H.checkInTime+" น.","from "+H.checkInTime)+"</small>":""))+
      row(T("เช็คเอาท์","Check-out"),dayTxt(d.checkout)+(H.checkOutTime?"<br><small>"+T("ก่อน "+H.checkOutTime+" น.","by "+H.checkOutTime)+"</small>":""))+
      row(T("จำนวน","Stay"),uNight(d.nights)+" · "+uPax(paxNum()))+
      row(T("อาหารเช้า","Breakfast"),d.breakfast==="included"?T("รวมแล้ว ✓","Included ✓"):d.breakfast==="added"?uPax(d.breakfastPax)+" · "+money(d.breakfastTotal):"")+
      row(T("บริการเสริม","Add-ons"),(d.addons||[]).map(a=>esc(a.name)+" ×"+a.qty).join(", "))+
      row(T("ส่วนลด","Discount"),d.discount?"-"+money(d.discount):"");
  } else {
    rows=row(T("กิจกรรม","Activity"),esc(d.serviceName))+row(T("วัน/เวลา","When"),dayTxt(d.date)+(d.time?" · "+esc(d.time):""))+row(T("จำนวน","Guests"),uPax(d.qty));
  }
  rows+='<div class="srow total"><span>'+T("ยอดรวม","Total")+'</span><span>'+money(d.amount)+'</span></div>'+
    row(T("การชำระเงิน","Payment"),!(d.amount>0)?T("ไม่มีค่าใช้จ่าย","Free"):rep?T("แจ้งโอนแล้ว · รอที่พักตรวจสอบ","Reported · awaiting check"):unpaid?T("ยังไม่ชำระ","Not paid yet"):T("ชำระแล้ว","Paid"));
  let pay="";
  if(unpaid&&d.amount>0&&H.promptpayId){ const src="/api/public/promptpay-qr?slug="+encodeURIComponent(slug)+"&amount="+Number(d.amount).toFixed(2);
    pay='<div class="holdnote" style="text-align:center">'+(d.holdUntil?'<b>⏱ '+T("กรุณาชำระภายใน "+whenTxt(d.holdUntil),"Please pay by "+whenTxt(d.holdUntil))+'</b><br>'+T("ไม่เช่นนั้นการจองจะถูกยกเลิกอัตโนมัติ","or the booking will be cancelled automatically")+'<br>':'')+
      '<img src="'+src+'" alt="PromptPay QR" style="width:180px;height:180px;margin:8px auto;display:block;background:#fff;border-radius:8px">'+
      esc(H.promptpayName||H.name)+' · '+T("พร้อมเพย์ ","PromptPay ")+esc(ppFmt(H.promptpayId))+'<div style="display:flex;gap:6px;margin-top:8px"><input id="dn-payref" placeholder="'+T("เวลาโอน/เลขอ้างอิง","Transfer time/ref")+'" style="flex:1"><button class="btn sm" id="dn-paybtn" onclick="reportLater()">'+T("แจ้งโอนแล้ว","I've paid")+'</button></div></div>'; }
  const tel=String(H.phone||"").replace(/[^\d+]/g,""), lu=lineUrl(H.lineId);
  const acts=(H.mapUrl?'<a class="btn ghost sm" href="'+esc(H.mapUrl)+'" target="_blank" rel="noopener">📍 '+T("แผนที่","Map")+'</a>':'')+(tel?'<a class="btn ghost sm" href="tel:'+tel+'">📞 '+T("โทรหาที่พัก","Call")+'</a>':'')+(lu?'<a class="btn ghost sm" href="'+lu+'" target="_blank" rel="noopener">💬 LINE</a>':'');
  document.getElementById("dn-ttl").textContent=H.name||"";
  document.getElementById("dn-body").innerHTML='<div class="done-hero"><div class="ok">✓</div><h3>'+(rep?T("แจ้งชำระแล้ว 🎉","Payment reported 🎉"):T("จองสำเร็จ 🎉","Booking confirmed 🎉"))+'</h3><p>'+(rep?T("ที่พักจะตรวจยอดโอนแล้วยืนยันให้","The host will verify your transfer"):T("ขอบคุณที่จองตรงกับเรา","Thank you for booking direct"))+'</p></div>'+
    '<div class="done-ref"><div class="l">'+T("หมายเลขการจอง (ใช้ยกเลิก/รีวิว/แจ้งโอน)","Booking no. (for cancel / review / payment)")+'</div><div class="n">'+esc(d.ref)+'</div><a href="#" onclick="copyRef();return false" style="font-size:12px">'+T("คัดลอก","Copy")+'</a></div>'+
    rows+pay+(acts?'<div class="done-acts">'+acts+'</div>':'')+
    (H.houseRules?'<details class="rules"><summary>📜 '+T("กฎที่พัก / ข้อควรรู้","House rules")+'</summary><div>'+esc(H.houseRules)+'</div></details>':'')+
    '<p class="note" style="text-align:center">📸 '+T("แคปหน้าจอนี้เก็บไว้","Take a screenshot of this page")+(d.email?" · "+T("ส่งรายละเอียดไปที่ ","details sent to ")+esc(d.email):"")+'</p>'+
    '<button class="btn block" onclick="closeDone()">'+T("เสร็จสิ้น","Done")+'</button>';
  document.getElementById("doneModal").classList.add("on"); }
async function reportLater(){ if(!DONE) return; const b=document.getElementById("dn-paybtn"); b.disabled=true;
  try{ const r=await fetch("/api/public/report-paid",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({slug,ref:DONE.ref,tel:DONE.tel,payRef:(document.getElementById("dn-payref").value||"").trim()})}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||"error");
    API.toast(T("แจ้งโอนแล้ว ที่พักจะตรวจสอบให้","Payment reported"),"ok"); showDone(DONE.kind,Object.assign({},DONE,{payStatus:"reported",holdUntil:null})); }
  catch(e){ API.toast(e.message,"err"); b.disabled=false; } }
// ===== ข้อมูลการเข้าพัก (เวลาเข้า-ออก ที่ตั้ง กฎ การยกเลิก ติดต่อ) =====
function renderStay(){ const sec=document.getElementById("sec-stay"); if(!sec) return; const H=HOTEL, items=[];
  if(H.checkInTime||H.checkOutTime) items.push('<div class="it"><div class="h">🕑 '+T("เช็คอิน – เช็คเอาท์","Check-in – Check-out")+'</div><div class="big">'+esc(H.checkInTime||"–")+' <span>→</span> '+esc(H.checkOutTime||"–")+'</div><div class="b">'+T("เช็คอินตั้งแต่ "+(H.checkInTime||"–")+" น. · เช็คเอาท์ก่อน "+(H.checkOutTime||"–")+" น.","Check-in from "+(H.checkInTime||"–")+" · check-out by "+(H.checkOutTime||"–"))+'</div></div>');
  if(H.address||H.mapUrl) items.push('<div class="it"><div class="h">📍 '+T("ที่ตั้ง","Location")+'</div><div class="b">'+esc(H.address||H.location||"")+'</div>'+(H.mapUrl?'<a class="btn ghost sm" href="'+esc(H.mapUrl)+'" target="_blank" rel="noopener">'+T("เปิดแผนที่ Google Maps","Open Google Maps")+'</a>':'')+'</div>');
  if(H.houseRules) items.push('<div class="it"><div class="h">📜 '+T("กฎที่พัก / ข้อควรรู้","House rules")+'</div><div class="b">'+esc(H.houseRules)+'</div></div>');
  const cd=H.cancelDays==null?3:H.cancelDays;
  items.push('<div class="it"><div class="h">↩️ '+T("การยกเลิก & ชำระเงิน","Cancellation & payment")+'</div><div class="b">'+(H.allowGuestCancel!==false?T("ยกเลิกฟรีก่อนเช็คอิน "+cd+" วัน (ยกเลิกเองได้ที่ท้ายหน้านี้)","Free cancellation up to "+cd+" days before check-in"):T("หากต้องการยกเลิก กรุณาติดต่อที่พัก","Please contact the property to cancel"))+"\n"+(H.promptpayId?T("ชำระผ่าน PromptPay เข้าบัญชีที่พักโดยตรง","Pay by PromptPay directly to the property"):"")+(H.holdHours>0?"\n"+T("จองแบบจ่ายทีหลัง: ชำระภายใน "+H.holdHours+" ชม.","Pay-later bookings: pay within "+H.holdHours+"h"):"")+'</div></div>');
  const tel=String(H.phone||"").replace(/[^\d+]/g,""), lu=lineUrl(H.lineId);
  if(tel||lu) items.push('<div class="it"><div class="h">💬 '+T("ติดต่อที่พัก","Contact")+'</div><div class="b">'+[H.phone?esc(H.phone):"",H.lineId?"LINE "+esc(H.lineId):""].filter(Boolean).join("\n")+'</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+(tel?'<a class="btn ghost sm" href="tel:'+tel+'">📞 '+T("โทร","Call")+'</a>':'')+(lu?'<a class="btn ghost sm" href="'+lu+'" target="_blank" rel="noopener">💬 LINE</a>':'')+'</div></div>');
  document.getElementById("g-stay").innerHTML=items.join(""); sec.style.display="block"; }
function openCancel(){ document.getElementById("cx-msg").textContent=""; document.getElementById("cancelModal").classList.add("on"); }
function closeCancel(){ document.getElementById("cancelModal").classList.remove("on"); }
async function doCancel(){ const ref=document.getElementById("cx-ref").value.trim(), tel=document.getElementById("cx-tel").value.trim();
  if(!ref||!tel){ document.getElementById("cx-msg").textContent=T("กรุณากรอกเลขการจองและเบอร์โทร","Enter booking no. and phone"); return; }
  const b=document.getElementById("cx-do"); b.disabled=true; b.textContent=T("กำลังยกเลิก…","Cancelling…");
  try{ const r=await API.pubCancel({ slug, ref, tel }); document.getElementById("cx-msg").textContent="✔ "+T("ยกเลิกแล้ว "+r.cancelled+" ห้อง","Cancelled "+uRoom(r.cancelled))+(r.freeCancel?T(" (ยกเลิกฟรี)"," (free)"):T(" (เลยกำหนด)"," (late)")); API.toast(T("ยกเลิกการจองแล้ว","Cancelled"),"ok"); setTimeout(()=>{closeCancel();gSearch();},1600);
  }catch(e){ document.getElementById("cx-msg").textContent="✗ "+e.message; } b.disabled=false; b.textContent=T("ยืนยันการยกเลิก","Confirm cancellation"); }
async function renderReviews(){
  const sec=document.getElementById("sec-reviews"); if(!sec) return;
  let rv=[]; try{ rv=await API.pubReviews(slug); }catch{ rv=[]; }
  if(!rv.length){ sec.style.display="none"; return; }
  sec.style.display="block";
  const stars=n=>"★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n);
  document.getElementById("g-reviews").innerHTML=rv.map(r=>'<div class="ben" style="text-align:left"><div style="color:var(--accent);font-size:16px">'+stars(r.rating)+'</div>'+(r.text?'<div style="margin:6px 0;font-size:14px">"'+esc(r.text)+'"</div>':'')+'<div style="color:var(--muted);font-size:12.5px">— '+esc(r.guestName||"แขก")+'</div></div>').join("");
}
function openReview(){ document.getElementById("rv-msg").textContent=""; document.getElementById("reviewModal").classList.add("on"); }
function closeReview(){ document.getElementById("reviewModal").classList.remove("on"); }
async function submitReview(){
  const ref=document.getElementById("rv-ref").value.trim(), tel=document.getElementById("rv-tel").value.trim();
  if(!ref||!tel){ document.getElementById("rv-msg").textContent=T("กรอกเลขจอง+เบอร์ที่ใช้จอง","Enter booking no. + phone"); return; }
  const b=document.getElementById("rv-do"); b.disabled=true;
  try{ const r=await API.pubReview({ slug, ref, tel, rating:+document.getElementById("rv-rate").value, text:document.getElementById("rv-text").value.trim() });
    document.getElementById("rv-msg").style.color="var(--green)"; document.getElementById("rv-msg").textContent="✔ "+r.message; setTimeout(closeReview,1800);
  }catch(e){ document.getElementById("rv-msg").style.color="var(--red)"; document.getElementById("rv-msg").textContent="✗ "+e.message; }
  b.disabled=false;
}
function setModalText(){
  document.getElementById("pay-ttl").textContent=T("ชำระเงินเพื่อยืนยัน","Pay to confirm");
  document.getElementById("pay-amt-l").textContent=T("ยอดชำระ","Amount");
  document.getElementById("pay-scan").textContent=T("สแกนจ่ายด้วยแอปธนาคาร (PromptPay)","Scan to pay (PromptPay)");
  document.getElementById("pay-noqr").textContent=T("โรงแรมยังไม่ได้ตั้งค่า PromptPay — ติดต่อโรงแรมเพื่อรับเลขบัญชี แล้วแจ้งชำระด้านล่าง","Property hasn't set up PromptPay — contact them, then report below.");
  document.getElementById("pay-ref-l").textContent=T("เลขอ้างอิง/เวลาโอน (ถ้ามี)","Transfer ref / time (optional)");
  document.getElementById("pay-ref").placeholder=T("เช่น 14:32 หรือ 4 ตัวท้าย","e.g. 14:32 or last 4");
  document.getElementById("pay-done").textContent=T("โอนแล้ว · แจ้งชำระเงิน","Paid · Report");
  document.getElementById("pay-note").textContent=T("โรงแรมจะตรวจสอบยอดและยืนยันให้อีกครั้ง","The property will verify and confirm.");
  document.getElementById("cx-ttl").textContent=T("ยกเลิกการจอง","Cancel booking");
  document.getElementById("cx-ref-l").textContent=T("เลขการจอง (เช่น BP-XXXXXX หรือ BA-XXXXXX)","Booking no. (e.g. BP-XXXXXX / BA-XXXXXX)");
  document.getElementById("cx-tel-l").textContent=T("เบอร์โทรที่ใช้จอง","Phone used to book");
  document.getElementById("cx-do").textContent=T("ยืนยันการยกเลิก","Confirm cancellation");
  document.getElementById("rv-ttl").textContent=T("เขียนรีวิว","Write a review");
  document.getElementById("rv-sub").textContent=T("รีวิวได้เฉพาะผู้ที่เคยจอง — ยืนยันด้วยเลขจอง + เบอร์","Only past guests can review — verify with booking no. + phone");
  document.getElementById("rv-ref-l").textContent=T("เลขการจอง","Booking no.");
  document.getElementById("rv-tel-l").textContent=T("เบอร์โทรที่ใช้จอง","Phone used to book");
  document.getElementById("rv-rate-l").textContent=T("ให้คะแนน","Rating");
  document.getElementById("rv-text-l").textContent=T("ความคิดเห็น","Your review");
  document.getElementById("rv-do").textContent=T("ส่งรีวิว","Submit review");
  const cd=(HOTEL.cancelDays==null?3:HOTEL.cancelDays);
  document.getElementById("cancel-policy").textContent=T("ยกเลิกฟรีก่อนเช็คอินอย่างน้อย "+cd+" วัน · หลังจากนั้นขึ้นกับนโยบายที่พัก","Free cancellation at least "+cd+" days before check-in.");
}
boot();
