<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>จองที่พัก / Book a stay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" id="favi" href="media/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
/* ================= หน้าจองของแขก — ฐานร่วมทุกเทมเพลต ================= */
html{scroll-behavior:smooth}
body{background:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.modal-open{overflow:hidden}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.25}
[id^="sec-"]{scroll-margin-top:80px}
.wrapx{max-width:1120px;margin:0 auto;padding:0 20px}
.sec{padding:64px 20px}
.sec-in{max-width:1120px;margin:0 auto}
.sec.tint{background:color-mix(in srgb,var(--brand) 5%,#fff)}
.sec h2{text-align:center;font-size:clamp(24px,3.2vw,32px);margin:0 0 8px;font-weight:800}
.kick{text-align:center;font-size:13px;font-weight:700;color:var(--brand-ink);margin-bottom:6px}
html[lang="en"] .kick{letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.lead{text-align:center;color:var(--muted);max-width:600px;margin:0 auto 30px;font-size:15px}
.lead:empty{display:none}
.empty{grid-column:1/-1}
@media(max-width:640px){.sec{padding:44px 16px}.wrapx{padding:0 16px}.lead{margin-bottom:22px}}
.btn{box-shadow:0 10px 22px -12px color-mix(in srgb,var(--brand) 80%,transparent)}
.btn.lg{padding:14px 26px}
.btn.light{background:#fff;color:var(--ink);box-shadow:0 14px 30px -12px rgba(0,0,0,.45)}
.btn.line{background:#06C755;color:#fff;box-shadow:0 10px 24px -10px rgba(6,199,85,.9)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.5);box-shadow:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn svg{width:20px;height:20px;flex:none}
input.bad{border-color:var(--red)!important;box-shadow:0 0 0 3px #fecaca}
/* โลโก้ = ตัวอักษรแรกของชื่อที่พัก (ไม่ใช่ "B" ของระบบ) */
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:17px;color:inherit;text-decoration:none;min-width:0}
.logo .dot{width:36px;height:36px;flex:none;border-radius:calc(var(--card-radius)*.55);background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.logo .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* โลโก้ที่พักอัปโหลดเอง: วางบนป้ายขาวมุมมน อ่านออกทุกพื้นหลัง (รูปปก/สีเข้ม) */
.logo .lgi{height:40px;min-width:40px;max-width:184px;padding:3px 6px;border-radius:calc(var(--card-radius)*.5 + 2px);background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 4px rgba(15,23,42,.12)}
.logo .lgi img{max-height:34px;max-width:172px;width:auto;height:auto;display:block;object-fit:contain}
.logo.wide .nm{display:none}
.gfoot .logo .lgi{height:46px;box-shadow:none}.gfoot .logo .lgi img{max-height:40px}
.promo{background:var(--accent);color:var(--on-accent);text-align:center;font-weight:700;font-size:14px;padding:10px 46px;position:relative;line-height:1.45}
.promo button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:inherit;font-size:17px;cursor:pointer;padding:8px;opacity:.8}
.promo-img{display:block;max-width:100%;border-radius:var(--card-radius);margin:0 auto 22px}
/* เมนูบน */
.gnav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid rgba(15,23,42,.07)}
.gnav .in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;min-height:62px}
.gnav .menu{display:flex;gap:22px;margin-left:auto;font-size:14.5px}
.gnav .menu a{color:var(--muted);text-decoration:none;font-weight:500} .gnav .menu a:hover{color:var(--ink)}
.gnav .btn{flex:none}
@media(max-width:820px){.gnav .menu{display:none}.gnav .btn{margin-left:auto}.gnav .in{padding:8px 16px}}
/* ภาพหลัก — รูปปกจริง + เงาไล่ให้อ่านตัวหนังสือออก (ไม่ย้อมสีรูป) */
.ghero{position:relative;min-height:460px;display:flex;align-items:flex-end;color:var(--on-brand);background:radial-gradient(900px 380px at 90% -10%,rgba(255,255,255,.22),transparent 60%),linear-gradient(135deg,var(--brand),var(--brand2));background-size:cover;background-position:center;overflow:hidden;isolation:isolate}
.ghero.has-img{color:#fff;background-color:#1d2733}
.ghero.has-img:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,12,20,.12) 0%,rgba(8,12,20,.2) 45%,rgba(8,12,20,.66) 100%)}
.ghero .in{max-width:1120px;margin:0 auto;padding:64px 20px 96px;width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);margin-bottom:14px}
.ghero h1{font-size:clamp(32px,6vw,58px);font-weight:800;margin:0 0 10px;line-height:1.1;text-shadow:0 2px 28px rgba(0,0,0,.22)}
.ghero .tag{font-size:clamp(15px,2vw,19px);opacity:.95;max-width:640px;margin:0}
.overlap{margin-top:-50px;position:relative;z-index:30}
@media(max-width:640px){.ghero{min-height:400px}.ghero .in{padding:48px 16px 80px}.overlap{margin-top:-42px}}
/* กล่องค้นหา */
.searchbar{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);box-shadow:0 24px 60px -26px rgba(15,23,42,.4);padding:14px;display:grid;grid-template-columns:1fr 1fr .85fr auto;gap:10px;align-items:end;text-align:left;color:var(--ink)}
.searchbar>*{min-width:0}
.searchbar label{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px 2px}
.searchbar input,.searchbar select{height:48px;border-color:#dce4ee;background:#fbfcfe;font-size:15px;color:var(--ink);min-width:0;width:100%}
.searchbar input:focus,.searchbar select:focus{outline:2px solid color-mix(in srgb,var(--brand) 40%,#fff);border-color:var(--brand)}
.searchbar .go{height:48px;padding:0 26px;white-space:nowrap}
.searchbar.pulse{animation:pulse 1.1s ease}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@media(max-width:760px){.searchbar{grid-template-columns:1fr 1fr;padding:12px}.searchbar .go{width:100%;padding:0 12px}}
/* การ์ดห้องพัก */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.room{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .25s,transform .25s;color:var(--ink);text-align:left}
.room:hover{box-shadow:0 22px 50px -26px rgba(15,23,42,.4);transform:translateY(-3px)}
.room.sold{opacity:.6}
.room .pic{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--brand),var(--brand2));background-size:cover;background-position:center;cursor:zoom-in}
.room .pic.noimg{cursor:default;display:flex;align-items:center;justify-content:center}
.room .pic .ph{font-family:var(--font-head);font-size:54px;font-weight:800;color:var(--on-brand);opacity:.5}
.room .badges{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.badge.save{background:var(--accent);color:var(--on-accent)}
.room .thumbs{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.room .thumbs button{width:40px;height:30px;border-radius:7px;border:2px solid rgba(255,255,255,.55);background-size:cover;background-position:center;padding:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.room .thumbs button.on{border-color:#fff}
.room .cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;border-radius:999px;padding:3px 9px}
.room .body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.room h3{font-size:19px;margin:0 0 6px;font-weight:800}
.room .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px;margin-bottom:8px}
.room .desc{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 10px}
.amen-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.amen-chips span{background:#f2f5f9;border-radius:999px;padding:3px 10px;font-size:12.5px;color:#334155}
.bf{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 11px;margin:0 0 10px;width:fit-content}
.bf.inc{background:#ecfdf5;color:#047857} .bf.opt{background:#fff7ed;color:#b45309}
.room .foot{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 12px}
.room .foot .btn{white-space:nowrap} .price{white-space:nowrap}
.price .ota{font-size:13px;color:var(--muted);text-decoration:line-through;margin-right:6px}
.price .now{font-size:22px;font-weight:800;color:var(--ink);font-family:var(--font-head)}
.price .per{font-size:12.5px;color:var(--muted);margin-left:3px}
.avail{display:block;font-size:12.5px;font-weight:700;color:var(--green);margin-top:2px}
.avail.low{color:var(--amber)} .avail.no{color:var(--red)}
.soldall{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:var(--card-radius);padding:14px 16px;margin:0 0 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.fil{display:flex;gap:8px;overflow-x:auto;padding:2px 0 18px;scrollbar-width:none} .fil::-webkit-scrollbar{display:none}
.fil button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:600}
.fil button.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* ส่วนอื่น ๆ */
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.am{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden;display:flex;flex-direction:column;color:var(--ink)}
.am .ic{aspect-ratio:16/10;background:color-mix(in srgb,var(--brand) 9%,#fff);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:40px}
.am .tx{padding:12px 14px 14px} .am .t{font-weight:800;font-size:15px} .am .d{color:var(--muted);font-size:13px;margin-top:2px} .am .p{color:var(--brand-ink);font-weight:800;font-size:14px;margin-top:6px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:160px;gap:10px}
.gal .gt{border-radius:calc(var(--card-radius)*.7);background-size:cover;background-position:center;background-color:var(--line);cursor:zoom-in;border:none;padding:0}
.gal .gt:first-child{grid-column:span 2;grid-row:span 2}
.gal-arrows{display:none}
.pband{display:none}
.rv .av{display:none}
@media(max-width:640px){.gal{grid-template-columns:1fr 1fr;grid-auto-rows:118px}}
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:920px;margin:0 auto}
@media(max-width:700px){.benefits{grid-template-columns:1fr}}
.ben{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);padding:22px;text-align:center;color:var(--ink)}
.ben .ic{width:50px;height:50px;border-radius:15px;margin:0 auto 10px;background:color-mix(in srgb,var(--brand) 10%,#fff);display:flex;align-items:center;justify-content:center;font-size:24px}
.ben .t{font-weight:800;margin-bottom:2px} .ben .d{color:var(--muted);font-size:13.5px} .ben .d a{color:var(--brand-ink);font-weight:700;text-decoration:none}
.rv{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);padding:20px;text-align:left;color:var(--ink)}
.rv .st{color:#f5a524;font-size:16px;letter-spacing:1px} .rv p{margin:8px 0;font-size:14.5px} .rv .who{color:var(--muted);font-size:13px}
.ctaband{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on-brand);text-align:center;padding:58px 20px}
.ctaband h2{font-size:clamp(22px,3vw,30px);margin:0 0 18px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;color:var(--ink)}
.about .img{aspect-ratio:4/3;border-radius:var(--card-radius);background-size:cover;background-position:center;background-color:var(--line)}
.about .txt h2,.about .txt .kick{text-align:left}
.about p{color:#334155;font-size:15.5px;line-height:1.8;white-space:pre-line;margin:0 0 16px}
.about.noimg{grid-template-columns:1fr;max-width:760px;margin:0 auto;text-align:center}
.about.noimg .txt h2,.about.noimg .txt .kick{text-align:center} .about.noimg .amen-chips{justify-content:center}
.about .amen-chips span{background:#fff;border:1px solid var(--line);font-size:13.5px;padding:6px 13px}
@media(max-width:760px){.about{grid-template-columns:1fr;gap:20px}}
.stay{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.stay .it{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);padding:20px;color:var(--ink)}
.stay .it .ic{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--brand) 10%,#fff);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.stay .it .h{font-weight:800;margin-bottom:6px}
.stay .it .b{color:var(--muted);font-size:14px;line-height:1.7;white-space:pre-line}
.stay .it .big{font-size:24px;font-weight:800;font-family:var(--font-head);margin:2px 0 4px} .stay .it .big span{color:var(--muted);font-weight:400}
.stay .it .btn{margin-top:12px}
.contact-band{background:color-mix(in srgb,var(--brand) 8%,#fff);text-align:center;padding:54px 20px;color:var(--ink)}
.contact-band h2{margin:0 0 6px;font-size:clamp(22px,3vw,30px)} .contact-band p{color:var(--muted);margin:0 0 20px}
.contact-band .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gfoot{background:#0f1622;color:#aab3c0;padding:44px 20px 100px;font-size:14px}
.gfoot .in{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:30px}
.gfoot .logo{color:#fff;margin-bottom:10px}
.gfoot b{display:block;color:#fff;margin-bottom:8px;font-size:14px}
.gfoot a{color:#cfd6e0;text-decoration:none;display:block;padding:4px 0} .gfoot a:hover{color:#fff}
.gfoot .pw{max-width:1120px;margin:28px auto 0;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:#7d8796;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:760px){.gfoot .in{grid-template-columns:1fr;gap:22px}}
/* ปุ่ม LINE ลอย (ของที่พัก) + ปุ่มภาษา */
#chatfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;display:inline-flex;align-items:center;gap:8px;background:#06C755;color:#fff;font-weight:700;font-size:14.5px;text-decoration:none;padding:12px 18px 12px 14px;border-radius:999px;box-shadow:0 12px 28px -8px rgba(6,199,85,.7);font-family:var(--font)}
#chatfab.tel{background:#13202e;box-shadow:0 12px 28px -8px rgba(15,23,42,.6)}
#chatfab svg{width:24px;height:24px;flex:none}
@media(max-width:640px){#chatfab{padding:12px 15px}#chatfab .t2{display:none}}
#bp-lang{left:14px!important;bottom:calc(14px + env(safe-area-inset-bottom))!important;padding:8px 13px!important;font-size:12.5px!important;background:rgba(255,255,255,.96)!important;color:#13202e!important;border:1px solid #dbe3ec!important;box-shadow:0 6px 18px rgba(15,23,42,.16)!important;z-index:55!important}
body.modal-open #chatfab,body.modal-open #bp-lang{display:none!important}
/* หน้าต่าง (มือถือ = แผ่นเลื่อนขึ้นจากล่าง) */
.modal{z-index:70}
.modal-card{border-radius:20px;color:var(--ink)}
.modal-head h3{font-size:18px;margin:0}
.bk-head .x,.modal-head .x{width:36px;height:36px;border-radius:50%;background:#f1f5f9;border:none;font-size:15px;cursor:pointer;color:var(--ink);flex:none}
@media(max-width:640px){.modal{align-items:flex-end;padding:0}.modal-card{max-width:none!important;width:100%;border-radius:22px 22px 0 0;max-height:94vh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
#bkModal .modal-card{padding:0;display:flex;flex-direction:column;overflow:hidden;max-width:500px}
.bk-head{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.bk-head .th{width:54px;height:54px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--on-brand);font-weight:800;font-size:22px}
.bk-head .hd{flex:1;min-width:0} .bk-head .hd b{display:block;font-size:16.5px;font-family:var(--font-head)} .bk-head .hd span{font-size:13px;color:var(--muted)}
.bk-body{padding:4px 16px 14px;overflow:auto;flex:1;overscroll-behavior:contain}
.bk-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff;box-shadow:0 -12px 24px -20px rgba(15,23,42,.5)}
.bk-foot .tot{flex:1;min-width:0;line-height:1.25} .bk-foot .tot small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .bk-foot .tot b{font-size:21px;font-family:var(--font-head)}
.bk-foot .btn{flex:none}
@media(max-width:640px){#bkModal .modal-card{padding-bottom:0}}
.grp{padding:14px 0;border-bottom:1px solid var(--line)} .grp:last-child{border-bottom:none}
.grp h4{font-size:14.5px;margin:0 0 10px;font-family:var(--font);font-weight:800;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line-it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px}
.line-it .n{flex:1;min-width:0} .line-it .n small{display:block;color:var(--muted);font-size:12.5px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff;flex:none}
.stepper button{width:34px;height:34px;border:none;background:none;font-size:19px;line-height:1;color:var(--brand-ink);cursor:pointer;border-radius:50%;font-family:inherit} .stepper button:disabled{color:#cbd5e1;cursor:default}
.stepper output{min-width:22px;text-align:center;font-weight:800}
.srow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0} .srow>span:last-child{text-align:right}
.srow.total{border-top:2px solid var(--line);margin-top:6px;padding-top:12px;font-size:18px;font-weight:800}
.paym{display:grid;gap:8px}
.paym .opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
.paym .opt .ic{font-size:22px;line-height:1.2} .paym .opt .t{font-weight:800;font-size:14.5px;color:var(--ink)} .paym .opt .d{font-size:12.5px;color:var(--muted);margin-top:1px}
.paym .opt .rd{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid #cbd5e1;flex:none;margin-top:2px;box-sizing:border-box}

.tpl-editorial .sec .sh .kick,.tpl-editorial .sec .sh h2,.tpl-editorial .sec .sh .lead{grid-column:2;text-align:left;margin-left:0}
.tpl-editorial .sec .sh h2{font-size:clamp(26px,3.6vw,40px);font-weight:700;letter-spacing:-.01em;margin-bottom:0}

.tpl-editorial .ben{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.4fr);align-items:baseline;gap:18px;text-align:left;background:none;border:none;border-top:1px solid var(--line);border-radius:0;padding:22px 0}

<script>
const slug = new URLSearchParams(location.search).get("h");

// กันลิงก์รูปแปลก ๆ หลุดออกจาก url('...') (ป้องกัน XSS)
function cu(u){ return String(u||"").replace(/["'()\\<>\s]/g, c=>"%"+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,"0")); }
function initial(n){ const c=[...String(n||"").trim()]; if(!c.length) return "•"; return (/[เแโใไ]/.test(c[0])&&c[1]?c[0]+c[1]:c[0]).toUpperCase(); }

function paxOpts(){ let o=""; for(let i=1;i<=12;i++) o+='<option value="'+i+'"'+(i===2?' selected':'')+'>'+uPax(i)+'</option>'; return o; }

function empty(msg){ return '<p class="empty">'+msg+'</p>'; }
function imgsOf(r){ return (r&&r.images&&r.images.length)?r.images:(r&&r.imageUrl?[r.imageUrl]:[]); }
const TH_D=["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."], TH_M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function dayTxt(ymd){ const d=new Date(ymd+"T00:00:00Z"); if(isNaN(d)) return ymd||""; return API.lang()==="en"?d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}):TH_D[d.getUTCDay()]+" "+d.getUTCDate()+" "+TH_M[d.getUTCMonth()]+" "+(d.getUTCFullYear()+543); }
function dayShort(ymd){ const d=new Date(ymd+"T00:00:00Z"); if(isNaN(d)) return ymd||""; return API.lang()==="en"?d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}):TH_D[d.getUTCDay()]+" "+d.getUTCDate()+" "+TH_M[d.getUTCMonth()]; }
function whenTxt(iso){ const d=new Date(iso); if(isNaN(d)) return ""; return d.toLocaleString(API.lang()==="en"?"en-GB":"th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Bangkok"}); }

function svcIcon(n){ const s=String(n||"").toLowerCase(); const M=[[/นวด|สปา|massage|spa/,"💆"],[/อาหารเช้า|breakfast/,"🍳"],[/อาหาร|ข้าว|dinner|lunch|bbq|บาร์บีคิว|หมูกระทะ|ปิ้งย่าง/,"🍽️"],[/กาแฟ|คาเฟ่|coffee|cafe/,"☕"],[/จักรยาน|bike|bicycle/,"🚲"],[/รถ|รับส่ง|transfer|shuttle|taxi/,"🚐"],[/ทัวร์|tour|เที่ยว|เดินป่า|trek/,"🧭"],[/workshop|เวิร์ก|ปั้น|คราฟต์|craft|class|ทำขนม|ย้อม/,"🏺"],[/ล่องเรือ|เรือ|kayak|boat|sup|พาย/,"🛶"],[/ตกปลา|fishing/,"🎣"],[/โยคะ|yoga|สมาธิ/,"🧘"],[/แคมป์|เต็นท์|camp|tent/,"⛺"],[/ซักผ้า|laundry/,"🧺"],[/เค้ก|cake|ดอกไม้|flower|ตกแต่ง|decor/,"🎂"],[/สระ|pool|ว่ายน้ำ/,"🏊"]]; for(const [re,ic] of M) if(re.test(s)) return ic; return "✨"; }

async function boot(){
  document.documentElement.lang=API.lang();
  const page=$("page"); API.mountLangToggle();
  if(!slug){ page.innerHTML='<div class="sec"><p class="empty">'+T("ลิงก์ไม่ถูกต้อง (ขาด ?h=ชื่อที่พัก)","Invalid link (missing ?h=slug)")+'</p></div>'; return; }
  try { HOTEL=await API.pubHotel(slug); } catch { page.innerHTML='<div class="sec"><p class="empty">'+T("ไม่พบที่พักนี้","Property not found")+'</p></div>'; return; }
  // ดูตัวอย่างเทมเพลต/ชุดสีก่อนเลือก (จากปุ่ม "ดูตัวอย่าง" ใน LINE) — ยังไม่บันทึก
  const pvT=QS.get("tpl"), pvP=QS.get("preset"); let preview=false;
  if(pvP){ const p=(API.STYLE_PRESETS||[]).find(x=>x.key===pvP); if(p){ ["brandColor","brandColor2","accentColor","accentColor2","fontFamily","uiStyle"].forEach(k=>{ HOTEL[k]=p[k]; }); preview=true; } }
  if(pvT && TPL[pvT]){ HOTEL.template=pvT; preview=true; }
  API.applyTheme(HOTEL); document.title=HOTEL.name+" · "+T("จองตรงกับที่พัก","Book direct");
  if(HOTEL.logoUrl){ const fa=+HOTEL.logoAspect||1, fv=$("favi"); if(fv&&fa>=0.6&&fa<=1.7){ fv.type="image/png"; fv.href=HOTEL.logoUrl; } }
  if(HOTEL.approved===false){ page.innerHTML='<div class="sec"><div class="panel" style="text-align:center;max-width:520px;margin:30px auto"><h2>'+T("ยังไม่เปิดรับจอง","Not open yet")+'</h2><p class="sub">'+T("ที่พักนี้กำลังรอการอนุมัติจากทีมงาน BARN-PARK","Awaiting approval from the BARN-PARK team.")+'</p></div></div>'; return; }
  try{ SVC=await API.pubServices(slug); }catch{ SVC=[]; }
  ACT=SVC.filter(s=>s.saleMode==="standalone"||s.saleMode==="both"); SVC=SVC.filter(s=>(s.saleMode||"addon")!=="standalone");
  const tpl=(TPL[HOTEL.template]?HOTEL.template:"rich");
  page.className="tpl-"+tpl; page.innerHTML=promoBar()+TPL[tpl]();
  if(preview){ const pb=document.createElement("div"); pb.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9998;background:#0f2540;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:8px 12px"; pb.textContent=T("👀 ตัวอย่าง (ยังไม่บันทึก) — ถ้าชอบ กลับไปกด “ใช้แบบนี้” ในแชท LINE","👀 Preview only — not saved yet"); document.body.appendChild(pb); }
  renderBenefits(); renderAbout(); renderStay(); renderContact(); renderFoot(); renderQuick(); renderBInfo(); renderPerks();
  renderSvc(); renderActs(); renderReviews(); mountChat(); setModalText();
  const din=$("g-din"), dout=$("g-dout"), today=API.ymd(new Date());
  din.min=today; din.value=addYmd(today,1); dout.min=addYmd(din.value,1); dout.value=addYmd(din.value,2);
  await gSearch();
  if(QS.get("find")) openFind();
}

function hidePromo(){ const e=$("g-promo"); if(e) e.remove(); try{ sessionStorage.setItem("bp_promo_x_"+slug,"1"); }catch{} }
function mountChat(){ if($("chatfab")) return; const lu=lineHref(), tel=telHref(); if(!lu&&!tel) return;

  if(lu){ a.href=lu; a.target="_blank"; a.rel="noopener"; a.setAttribute("aria-label",T("แชท LINE กับที่พัก","Chat with the property on LINE")); a.innerHTML=chatSvg()+'<span>'+T("แชท LINE","Chat on LINE")+'<span class="t2"> '+T("กับที่พัก","with us")+'</span></span>'; }

  if(m==="transfer"&&!hasBank) m=""; if(m==="promptpay"&&!hasPP) m=""; if(m!=="promptpay"&&m!=="transfer") m=hasPP?"promptpay":hasBank?"transfer":"";
  DONE.shownMethod=m;
  const dl=d.holdUntil?'<b>⏱ '+T("กรุณาชำระภายใน "+whenTxt(d.holdUntil),"Please pay by "+whenTxt(d.holdUntil))+'</b><br>'+T("ไม่เช่นนั้นการจองจะถูกยกเลิกอัตโนมัติ","or the booking will be cancelled automatically"):'';
  if(!m) return '<div class="holdnote">'+(dl?dl+'<br>':'')+T("ติดต่อที่พักเพื่อชำระเงิน","Please contact the property to pay")+'</div>';
  const body=m==="promptpay"?'<div class="qrwrap"><img src="'+qrSrc(d.amount)+'" alt="PromptPay QR" width="190" height="190" style="display:block;width:190px;height:190px"></div><div style="text-align:center;font-size:13px">'+esc(H.promptpayName||H.name)+' · '+T("พร้อมเพย์ ","PromptPay ")+esc(ppFmt(H.promptpayId))+'</div>':bankCard(H.bank);
  const alt=(m==="promptpay"&&hasBank)||(m==="transfer"&&hasPP)?'<div style="text-align:center;margin-top:6px"><a href="#" onclick="switchDonePay();return false" style="font-size:13px">'+(m==="promptpay"?T("หรือโอนเข้าบัญชีธนาคาร","Or pay by bank transfer"):T("หรือสแกนจ่ายพร้อมเพย์","Or pay with PromptPay"))+'</a></div>':'';
  return '<div class="paybox">'+(dl?'<div class="holdnote" style="margin:0 0 10px;text-align:center">'+dl+'</div>':'')+body+alt+'<div style="display:flex;gap:6px;margin-top:10px"><input id="dn-payref" placeholder="'+T("เวลาโอน/เลขอ้างอิง (ถ้ามี)","Transfer time / ref (optional)")+'" style="flex:1;min-width:0"><button class="btn sm" id="dn-paybtn" style="flex:none" onclick="reportLater()">'+T("แจ้งโอนแล้ว","I've paid")+'</button></div></div>'; }
function switchDonePay(){ if(!DONE) return; DONE.payMethod=DONE.shownMethod==="promptpay"?"transfer":"promptpay"; showDone(DONE.kind,DONE); }
function showDone(kind,d){ DONE=Object.assign({},d,{kind}); const H=HOTEL;
  const cancelled=d.status==="cancelled", rep=d.payStatus==="reported", unpaid=d.payStatus==="unpaid", onsite=d.payStatus==="onsite", paid=d.payStatus==="paid", free=!(d.amount>0);
  const row=(k,v)=>v?'<div class="srow"><span style="color:var(--muted)">'+k+'</span><span>'+v+'</span></div>':"";
  let rows="";
  if(kind==="room"){
    rows=row(T("ห้อง","Room"),esc(d.roomName)+(d.rooms>1?" × "+uRoom(d.rooms):""))+
      row(T("เช็คอิน","Check-in"),dayTxt(d.checkin)+(H.checkInTime?"<br><small>"+T("ตั้งแต่ "+H.checkInTime+" น.","from "+H.checkInTime)+"</small>":""))+
      row(T("เช็คเอาท์","Check-out"),dayTxt(d.checkout)+(H.checkOutTime?"<br><small>"+T("ก่อน "+H.checkOutTime+" น.","by "+H.checkOutTime)+"</small>":""))+
      row(T("จำนวน","Stay"),uNight(d.nights)+(d.pax?" · "+uPax(d.pax):""))+
      row(T("อาหารเช้า","Breakfast"),d.breakfast==="included"?T("รวมแล้ว ✓","Included ✓"):d.breakfast==="added"?uPax(d.breakfastPax)+" · "+money(d.breakfastTotal):"")+
      row(T("บริการเสริม","Extras"),(d.addons||[]).map(a=>esc(a.name)+" ×"+a.qty).join(", "))+
      row(T("ส่วนลด","Discount"),d.discount?"-"+money(d.discount):"");
  } else rows=row(T("กิจกรรม","Activity"),esc(d.serviceName))+row(T("วัน/เวลา","When"),dayTxt(d.date)+(d.time?" · "+esc(d.time):""))+row(T("จำนวน","Guests"),uPax(d.qty));
  const pst=cancelled?T("ยกเลิกแล้ว","Cancelled"):free?T("ไม่มีค่าใช้จ่าย","Free"):rep?T("แจ้งโอนแล้ว · รอที่พักตรวจสอบ","Reported · awaiting check"):paid?T("ชำระแล้ว ✅","Paid ✅"):onsite?T("จ่ายที่เคาน์เตอร์ตอนเช็คอิน","Pay at the property"):T("ยังไม่ชำระ","Not paid yet");
  rows+='<div class="srow total"><span>'+T("ยอดรวม","Total")+'</span><span>'+money(d.amount)+'</span></div>'+row(T("การชำระเงิน","Payment"),pst);
  const pay=cancelled||free?'':unpaid?payBlock(d):onsite?'<div class="holdnote ok">💵 '+T("ชำระ "+money(d.amount)+" ที่เคาน์เตอร์ตอนเช็คอิน","Pay "+money(d.amount)+" on arrival")+'</div>':'';
  const tel=telHref(), lu=lineHref();
  const acts=(H.mapUrl?'<a class="btn ghost sm" href="'+esc(H.mapUrl)+'" target="_blank" rel="noopener">📍 '+T("แผนที่","Map")+'</a>':'')+(tel?'<a class="btn ghost sm" href="'+tel+'">📞 '+T("โทรหาที่พัก","Call")+'</a>':'')+(lu?'<a class="btn line sm" href="'+esc(lu)+'" target="_blank" rel="noopener">💬 '+T("แชท LINE","LINE")+'</a>':'');
  const hero=cancelled?'<div class="done-hero"><div class="ok no">✕</div><h3>'+T("การจองนี้ถูกยกเลิกแล้ว","This booking was cancelled")+'</h3><p>'+(d.cancelReason==="auto-unpaid"?T("ระบบยกเลิกเพราะยังไม่ได้รับการชำระเงินตามเวลา","Cancelled automatically — payment was not received in time"):T("หากมีข้อสงสัย ติดต่อที่พักได้เลย","Contact the property if you have questions"))+'</p></div>'
    :'<div class="done-hero"><div class="ok">✓</div><h3>'+(d.lookup?T("การจองของคุณ","Your booking"):rep?T("แจ้งชำระแล้ว 🎉","Payment reported 🎉"):T("จองสำเร็จ 🎉","Booking confirmed 🎉"))+'</h3><p>'+(rep?T("ที่พักจะตรวจยอดโอนแล้วยืนยันให้","The host will verify your transfer"):d.lookup?T("สถานะล่าสุดของการจอง","Latest booking status"):T("ขอบคุณที่จองตรงกับเรา","Thank you for booking direct"))+'</p></div>';
  const own=d.lookup&&!cancelled&&H.allowGuestCancel!==false?'<button class="btn ghost block" style="margin-top:6px;color:var(--red);border-color:#fecaca" onclick="cancelFromDone()">↩️ '+T("ยกเลิกการจองนี้","Cancel this booking")+'</button>':'';
  $("dn-ttl").textContent=H.name||"";
  $("dn-body").innerHTML=hero+'<div class="done-ref"><div class="l">'+T("หมายเลขการจอง (ใช้เช็กการจอง/ยกเลิก/รีวิว)","Booking no. (to look up / cancel / review)")+'</div><div class="n">'+esc(d.ref)+'</div><a href="#" onclick="copyRef();return false" style="font-size:12px">'+T("คัดลอก","Copy")+'</a></div>'+
    rows+pay+(acts?'<div class="done-acts">'+acts+'</div>':'')+
    (H.houseRules&&!cancelled?'<details class="rules"><summary>📜 '+T("กฎที่พัก / ข้อควรรู้","House rules")+'</summary><div>'+esc(H.houseRules)+'</div></details>':'')+
    (d.lookup?'':'<p class="note" style="text-align:center">📸 '+T("แคปหน้าจอนี้เก็บไว้","Take a screenshot of this page")+(d.email?" · "+T("ส่งรายละเอียดไปที่ ","details sent to ")+esc(d.email):"")+'</p>')+own+
    '<button class="btn block" style="margin-top:8px" onclick="closeDone()">'+T("เสร็จสิ้น","Done")+'</button>';
  openModal("doneModal"); }
async function reportLater(){ if(!DONE) return; const b=$("dn-paybtn"); b.disabled=true;
  try{ const r=await fetch("/api/public/report-paid",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({slug,ref:DONE.ref,tel:DONE.tel,payRef:val("dn-payref").trim(),method:DONE.shownMethod||""})}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||"error");
    API.toast(T("แจ้งโอนแล้ว ที่พักจะตรวจสอบให้","Payment reported"),"ok"); showDone(DONE.kind,Object.assign({},DONE,{payStatus:"reported",holdUntil:null,payMethod:DONE.shownMethod})); }
  catch(e){ API.toast(e.message,"err"); b.disabled=false; } }
function openFind(){ $("fd-msg").textContent=""; openModal("findModal"); }
async function doFind(){ const ref=val("fd-ref").trim(), tel=val("fd-tel").trim(), msg=$("fd-msg");
  if(!ref||!tel){ msg.textContent=T("กรุณากรอกเลขการจองและเบอร์โทร","Enter booking no. and phone"); return; }
  const b=$("fd-do"); b.disabled=true;
  try{ const r=await fetch("/api/public/lookup",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({slug,ref,tel})}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||"error");
    closeModal("findModal"); showDone(d.kind,Object.assign({},d,{tel,lookup:true})); }
  catch(e){ msg.textContent="✗ "+e.message; } b.disabled=false; }
function cancelFromDone(){ if(!DONE) return; closeModal("doneModal"); $("cx-ref").value=DONE.ref; $("cx-tel").value=DONE.tel; openCancel(); }

// ================= ยกเลิก / รีวิว =================
function openCancel(){ $("cx-msg").textContent=""; openModal("cancelModal"); }
async function doCancel(){ const ref=val("cx-ref").trim(), tel=val("cx-tel").trim();
  if(!ref||!tel){ $("cx-msg").textContent=T("กรุณากรอกเลขการจองและเบอร์โทร","Enter booking no. and phone"); return; }
  const b=$("cx-do"); b.disabled=true; b.textContent=T("กำลังยกเลิก…","Cancelling…");
  try{ const r=await API.pubCancel({ slug, ref, tel }); $("cx-msg").textContent="✔ "+T("ยกเลิกแล้ว","Cancelled")+(r.freeCancel?T(" (ยกเลิกฟรี)"," (free)"):T(" (เลยกำหนดยกเลิกฟรี)"," (after free-cancellation period)")); API.toast(T("ยกเลิกการจองแล้ว","Booking cancelled"),"ok"); setTimeout(()=>{ closeCancel(); gSearch(); },1600);
  }catch(e){ $("cx-msg").textContent="✗ "+e.message; } b.disabled=false; b.textContent=T("ยืนยันการยกเลิก","Confirm cancellation"); }
function openReview(){ $("rv-msg").textContent=""; openModal("reviewModal"); }
async function submitReview(){
  const ref=val("rv-ref").trim(), tel=val("rv-tel").trim();
  if(!ref||!tel){ $("rv-msg").textContent=T("กรอกเลขจอง + เบอร์ที่ใช้จอง","Enter booking no. + phone"); return; }
  const b=$("rv-do"); b.disabled=true;
  try{ const r=await API.pubReview({ slug, ref, tel, rating:+val("rv-rate"), text:val("rv-text").trim() });
    $("rv-msg").style.color="var(--green)"; $("rv-msg").textContent="✔ "+r.message; setTimeout(closeReview,1800);
  }catch(e){ $("rv-msg").style.color="var(--red)"; $("rv-msg").textContent="✗ "+e.message; }
  b.disabled=false; }
function setModalText(){
  const S=(id,t)=>{ const e=$(id); if(e) e.textContent=t; };
  S("pay-amt-l",T("ยอดที่ต้องชำระ","Amount to pay")); S("pay-scan",T("สแกนจ่ายด้วยแอปธนาคารไหนก็ได้","Scan with any Thai banking app"));
  S("pay-noqr",T("ที่พักยังไม่ได้ตั้งช่องทางรับเงินออนไลน์ — ติดต่อที่พักเพื่อรับเลขบัญชี แล้วแจ้งชำระด้านล่าง","The property hasn't set up online payment — contact them, then report below."));
  S("pay-ref-l",T("เวลาโอน / เลขอ้างอิง (ถ้ามี)","Transfer time / ref (optional)")); $("pay-ref").placeholder=T("เช่น 14:32 หรือ 4 ตัวท้าย","e.g. 14:32 or last 4 digits");
  S("pay-done",T("โอนแล้ว · แจ้งชำระเงิน","I've paid · Report payment")); S("pay-later",T("จองไว้ก่อน โอนทีหลัง","Hold booking, pay later"));
  S("pay-note",T("ที่พักจะตรวจสอบยอดและยืนยันให้อีกครั้ง","The property will verify and confirm."));
  S("cx-ttl",T("ยกเลิกการจอง","Cancel booking")); S("cx-ref-l",T("เลขการจอง (เช่น BP-XXXXXX หรือ BA-XXXXXX)","Booking no. (e.g. BP-XXXXXX / BA-XXXXXX)")); S("cx-tel-l",T("เบอร์โทรที่ใช้จอง","Phone used to book")); S("cx-do",T("ยืนยันการยกเลิก","Confirm cancellation"));
  S("rv-ttl",T("เขียนรีวิว","Write a review")); S("rv-sub",T("รีวิวได้เฉพาะผู้ที่เคยจอง — ยืนยันด้วยเลขจอง + เบอร์","Only past guests can review — verify with booking no. + phone"));
  S("rv-ref-l",T("เลขการจอง","Booking no.")); S("rv-tel-l",T("เบอร์โทรที่ใช้จอง","Phone used to book")); S("rv-rate-l",T("ให้คะแนน","Rating")); S("rv-text-l",T("ความคิดเห็น","Your review")); S("rv-do",T("ส่งรีวิว","Submit review"));
  S("fd-ttl",T("เช็กการจอง / แจ้งโอน","Find my booking")); S("fd-sub",T("ใส่เลขการจองและเบอร์โทรที่ใช้จอง เพื่อดูสถานะ แจ้งโอน หรือยกเลิก","Enter your booking no. and phone to see status, report payment or cancel"));
  S("fd-ref-l",T("เลขการจอง","Booking no.")); S("fd-tel-l",T("เบอร์โทรที่ใช้จอง","Phone used to book")); S("fd-do",T("ดูการจอง","Find booking"));
  const cd=(HOTEL.cancelDays==null?3:HOTEL.cancelDays);
  S("cancel-policy",T("ยกเลิกฟรีก่อนเช็คอินอย่างน้อย "+cd+" วัน · หลังจากนั้นขึ้นกับนโยบายที่พัก","Free cancellation at least "+cd+" days before check-in."));
}
boot();
</script>
