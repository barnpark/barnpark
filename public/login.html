<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ · BARN-PARK</title>
<link rel="stylesheet" href="style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0d9488,#2563eb)}
  .box{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:390px;box-shadow:0 24px 70px rgba(0,0,0,.28);margin:18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:4px}
  .brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
</style>
</head>
<body>
  <div class="box">
    <div class="brand"><span class="dot">B</span>BARN-PARK</div>
    <p class="sub" style="margin:0 0 20px">ระบบจองที่พัก สำหรับที่พักชุมชนและ SME</p>
    <div class="err" id="err"></div>
    <div class="field"><label>อีเมล</label><input id="email" type="email" placeholder="you@example.com" autocomplete="username"></div>
    <div class="field"><label>รหัสผ่าน</label><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn block lg" id="go" onclick="doLogin()">เข้าสู่ระบบ</button>
    <p class="note" style="text-align:center;margin-top:14px">ยังไม่มีบัญชี? ติดต่อผู้ดูแลแพลตฟอร์ม</p>
  </div>
<script src="api.js"></script>
<script>
async function route(){ const me = await API.me(); location.href = me.role === "admin" ? "admin.html" : "app.html"; }
async function doLogin(){
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err"); err.style.display = "none";
  if(!email || !pw){ err.textContent="กรุณากรอกอีเมลและรหัสผ่าน"; err.style.display="block"; return; }
  const b = document.getElementById("go"); b.disabled = true; b.textContent = "กำลังเข้าสู่ระบบ…";
  try {
    const { token } = await API.login(email, pw);
    API.setToken(token);
    await route();
  } catch(e){ err.textContent = e.message || "เข้าสู่ระบบไม่สำเร็จ"; err.style.display="block"; b.disabled=false; b.textContent="เข้าสู่ระบบ"; }
}
document.getElementById("pw").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
if(API.token()){ route().catch(()=>{}); }
</script>
</body>
</html>
