<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ · BARN-PARK</title>
<link rel="stylesheet" href="style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0d9488,#2563eb)}
  .box{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:420px;box-shadow:0 24px 70px rgba(0,0,0,.28);margin:18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:4px}
  .brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
</style>
</head>
<body>
  <div class="box">
    <div class="brand"><span class="dot">B</span>BARN-PARK</div>
    <p class="sub" style="margin:0 0 20px">ระบบจองที่พัก สำหรับที่พักชุมชนและ SME</p>
    <div class="err" id="err"></div>
    <div id="step1">
      <div class="field"><label>อีเมล</label><input id="email" type="email" placeholder="you@example.com" autocomplete="username"></div>
      <div class="field"><label>รหัสผ่าน</label><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn block lg" id="go" onclick="doLogin()">เข้าสู่ระบบ</button>
      <p class="note" style="text-align:center;margin-top:14px">ยังไม่มีบัญชี? <a href="#" onclick="showReg();return false">ลงทะเบียนที่พักกับ Barn-Park ›</a></p>
    </div>
    <div id="stepReg" style="display:none">
      <div class="field"><label>ชื่อที่พัก *</label><input id="r-hotel" placeholder="เช่น ภูวิว เกสต์เฮาส์"></div>
      <div class="field"><label>ทำเล</label><input id="r-loc" placeholder="เช่น เชียงใหม่"></div>
      <div class="field"><label>เบอร์โทร</label><input id="r-phone" placeholder="08x-xxx-xxxx"></div>
      <div class="field"><label>อีเมล (ใช้ล็อกอิน) *</label><input id="r-email" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>ตั้งรหัสผ่าน * (อย่างน้อย 6 ตัว)</label><input id="r-pw" type="password" placeholder="••••••••"></div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:#5b7089;font-size:12px;margin-bottom:10px"><input type="checkbox" id="r-consent" style="width:auto;margin-top:2px"><span>ยอมรับ <a href="privacy.html" target="_blank">นโยบายความเป็นส่วนตัว</a> และการเก็บข้อมูลเพื่อให้บริการ</span></label>
      <button class="btn block lg" id="goReg" onclick="doRegister()">สร้างบัญชีที่พัก</button>
      <p class="note" style="text-align:center;margin-top:14px"><a href="#" onclick="backToLogin();return false">‹ มีบัญชีแล้ว เข้าสู่ระบบ</a></p>
    </div>
    <div id="step2" style="display:none">
      <p class="sub" style="margin:0 0 12px">เราส่งรหัส OTP ไปที่อีเมล <b id="otp-email"></b> — กรอกเพื่อยืนยัน (มีอายุ 5 นาที)</p>
      <div class="field"><label>รหัส OTP (6 หลัก)</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="______" style="letter-spacing:6px;text-align:center;font-size:20px"></div>
      <button class="btn block lg" id="go2" onclick="doVerify()">ยืนยัน</button>
      <p class="note" style="text-align:center;margin-top:14px"><a href="#" onclick="backToLogin();return false">‹ ย้อนกลับ</a></p>
    </div>
  </div>
<script src="api.js"></script>
<script>
let pendingEmail = null;
async function route(){ const me = await API.me(); location.href = me.role === "admin" ? "admin.html" : "app.html"; }
function showErr(msg){ const e=document.getElementById("err"); e.style.cssText="background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:block"; e.textContent=msg; }
async function doLogin(){
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("pw").value;
  document.getElementById("err").style.display = "none";
  if(!email || !pw){ showErr("กรุณากรอกอีเมลและรหัสผ่าน"); return; }
  const b = document.getElementById("go"); b.disabled = true; b.textContent = "กำลังตรวจสอบ…";
  try {
    const res = await API.login(email, pw);
    if(res.token){ API.setToken(res.token); await route(); return; }
    // ต้องยืนยัน OTP
    pendingEmail = res.email || email;
    document.getElementById("otp-email").textContent = pendingEmail;
    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";
    document.getElementById("otp").focus();
  } catch(e){ showErr(e.message || "เข้าสู่ระบบไม่สำเร็จ"); }
  b.disabled = false; b.textContent = "เข้าสู่ระบบ";
}
async function doVerify(){
  const otp = document.getElementById("otp").value.trim();
  document.getElementById("err").style.display = "none";
  if(otp.length < 4){ showErr("กรอกรหัส OTP ให้ครบ"); return; }
  const b = document.getElementById("go2"); b.disabled = true; b.textContent = "กำลังยืนยัน…";
  try {
    const { token } = await API.verifyOtp(pendingEmail, otp);
    API.setToken(token); await route();
  } catch(e){ showErr(e.message || "ยืนยันไม่สำเร็จ"); b.disabled=false; b.textContent="ยืนยัน"; }
}
function backToLogin(){ document.getElementById("step2").style.display="none"; document.getElementById("stepReg").style.display="none"; document.getElementById("step1").style.display="block"; document.getElementById("err").style.display="none"; }
function showReg(){ document.getElementById("step1").style.display="none"; document.getElementById("step2").style.display="none"; document.getElementById("stepReg").style.display="block"; document.getElementById("err").style.display="none"; }
async function doRegister(){
  const v=id=>document.getElementById(id).value.trim();
  const hotelName=v("r-hotel"), email=v("r-email"), password=document.getElementById("r-pw").value;
  document.getElementById("err").style.display="none";
  if(!hotelName||!email||!password){ showErr("กรอกชื่อที่พัก อีเมล และรหัสผ่านให้ครบ"); return; }
  if(password.length<6){ showErr("รหัสผ่านอย่างน้อย 6 ตัวอักษร"); return; }
  if(!document.getElementById("r-consent").checked){ showErr("กรุณายอมรับนโยบายความเป็นส่วนตัวก่อนสมัคร"); return; }
  const b=document.getElementById("goReg"); b.disabled=true; b.textContent="กำลังสร้างบัญชี…";
  try{
    const res=await API.register({ hotelName, location:v("r-loc"), phone:v("r-phone"), email, password });
    // สมัครสำเร็จ → ล็อกอินให้เลย เข้าแอปทันที (ลื่น ไม่ต้องกรอกซ้ำ/ไม่ต้อง OTP รอบแรก)
    if(res.token){ API.setToken(res.token); location.href="app.html"; return; }
    // เผื่อกรณีไม่มี token — กลับไปหน้าเข้าสู่ระบบ
    backToLogin(); document.getElementById("email").value=res.email; document.getElementById("pw").focus();
  }catch(err){ showErr(err.message||"ลงทะเบียนไม่สำเร็จ"); }
  b.disabled=false; b.textContent="สร้างบัญชีที่พัก";
}
document.getElementById("pw").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
document.getElementById("otp").addEventListener("keydown", e => { if(e.key==="Enter") doVerify(); });
if(API.token()){ route().catch(()=>{}); }
if(new URLSearchParams(location.search).get("mode")==="register"){ showReg(); }
API.mountSupport();
</script>
</body>
</html>
