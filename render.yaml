services:
  - type: web
    name: barn-park
    runtime: node
    plan: starter          # หรือ free (จะหลับหลังไม่มีคนใช้ 15 นาที)
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: BARN-PARK
      - key: LINE_CHANNEL_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: ADMIN_LINE_TO
        sync: false
      - key: SUPPORT_LINE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
